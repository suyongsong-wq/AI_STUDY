function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return '방금 전';
  if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
  if (diff < 2592000) return `${Math.floor(diff / 86400)}일 전`;
  return new Date(iso).toLocaleDateString('ko-KR');
}

function clockTime(iso) {
  return new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

// 해시 라우터 — 빌드 도구 없이 단일 파일에서 여러 화면을 쓰기 위한 최소 구현
function useHashRoute() {
  const [hash, setHash] = useState(() => window.location.hash.slice(1) || '/');
  useEffect(() => {
    const onChange = () => setHash(window.location.hash.slice(1) || '/');
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  return hash;
}

}

// ============================================================
// 🔐 인증 컨텍스트
//    session(auth.users) 과 profile(carrot_profiles) 을 분리해서 들고 있는다.
//    5~6주차에 만든 계정은 auth.users 에만 있고 프로필이 없을 수 있어,
//    그 경우 온보딩(동네 설정) 화면으로 유도한다.
// ============================================================
const AuthCtx = createContext(null);
const useAuth = () => useContext(AuthCtx);

function AuthProvider({ children }) {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);

  const loadProfile = useCallback(async (uid) => {
    if (!uid) { setProfile(null); return null; }
    const { data } = await sb.from('carrot_profiles').select('*').eq('id', uid).maybeSingle();
    setProfile(data ?? null);
    return data ?? null;
  }, []);

  useEffect(() => {
    let alive = true;
    sb.auth.getSession().then(async ({ data }) => {
      if (!alive) return;
      setSession(data.session);
      await loadProfile(data.session?.user?.id);
      setLoading(false);
    });
    const { data: sub } = sb.auth.onAuthStateChange(async (_e, s) => {
      setSession(s);
      await loadProfile(s?.user?.id);
    });
    return () => { alive = false; sub.subscription.unsubscribe(); };
  }, [loadProfile]);

  const value = {
    session,
    user: session?.user ?? null,
    profile,
    loading,
    reloadProfile: () => loadProfile(session?.user?.id),
    signOut: () => sb.auth.signOut(),
  };
  return <AuthCtx.Provider value={value}>{children}</AuthCtx.Provider>;
}

// ============================================================
// 🖼 이미지 업로드 (Supabase Storage)
//    RLS 정책상 경로 첫 세그먼트가 본인 uid 여야 통과한다.
// ============================================================
async function uploadImages(files, uid) {
  const urls = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${uid}/${Date.now()}-${i}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, file, {
      cacheControl: '3600', upsert: false, contentType: file.type || 'image/jpeg',
    });
    if (error) throw error;
    urls.push(sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
  }
  return urls;
}

function AuthPage() {
  const [mode, setMode] = useState('login');   // login | signup
  const [form, setForm] = useState({ email: '', password: '', nickname: '', region: '' });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const submit = async (e) => {
    e.preventDefault();
    setErr(''); setBusy(true);
    try {
      if (mode === 'signup') {
        if (!form.nickname.trim()) throw new Error('닉네임을 입력해 주세요.');
        if (!form.region.trim()) throw new Error('동네를 입력해 주세요.');
        if (form.password.length < 6) throw new Error('비밀번호는 6자 이상이어야 해요.');

        const { data, error } = await sb.auth.signUp({ email: form.email.trim(), password: form.password });
        if (error) throw error;
        if (!data.session) {
          setErr('가입 확인 메일을 보냈어요. 메일 인증 후 로그인해 주세요.');
          setMode('login');
          return;
        }
        // 세션이 바로 생겼으면 프로필(닉네임·동네)까지 만들어 준다
        const { error: pErr } = await sb.from('carrot_profiles').insert({
          id: data.session.user.id, nickname: form.nickname.trim(), region: form.region.trim(),
        });
        if (pErr) throw pErr;
        go('/');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: form.email.trim(), password: form.password });
        if (error) throw error;
        go('/');
      }
    } catch (e2) {
      const m = e2.message || String(e2);
      setErr(
        /already registered|User already/i.test(m) ? '이미 가입된 이메일이에요. 로그인해 주세요.'
        : /Invalid login/i.test(m) ? '이메일 또는 비밀번호가 올바르지 않아요.'
        : m
      );
    } finally { setBusy(false); }
  };

  return (
    <div className="app-shell flex flex-col min-h-screen">
      <div className="flex-1 px-6 pt-16 pb-10">
        <div className="text-center mb-10">
          <div className="text-5xl mb-3">🥕</div>
          <h1 className="text-2xl font-extrabold text-gray-900">당근마켓</h1>
          <p className="mt-2 text-sm text-gray-500">우리 동네 중고 직거래</p>
        </div>

        <div className="flex bg-gray-100 rounded-lg p-1 mb-6">
          {[['login', '로그인'], ['signup', '회원가입']].map(([k, label]) => (
            <button key={k} onClick={() => { setMode(k); setErr(''); }}
              className={`flex-1 py-2 text-sm font-bold rounded-md transition ${mode === k ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`}>
              {label}
            </button>
          ))}
        </div>

        <form onSubmit={submit} className="space-y-4">
          <Field label="이메일">
            <input className={inputCls} type="email" required autoComplete="email"
              value={form.email} onChange={set('email')} placeholder="you@example.com" />
          </Field>
          <Field label="비밀번호" hint={mode === 'signup' ? '6자 이상' : null}>
            <input className={inputCls} type="password" required
              autoComplete={mode === 'signup' ? 'new-password' : 'current-password'}
              value={form.password} onChange={set('password')} placeholder="••••••" />
          </Field>

          {mode === 'signup' && (
            <>
              <Field label="닉네임">
                <input className={inputCls} value={form.nickname} onChange={set('nickname')} placeholder="당근이" />
              </Field>
              <Field label="우리 동네" hint="거래할 동네를 입력하거나 아래에서 골라 주세요">
                <input className={inputCls} list="region-presets" value={form.region}
                  onChange={set('region')} placeholder="서울 강남구 역삼동" />
                <datalist id="region-presets">
                  {REGION_PRESETS.map((r) => <option key={r} value={r} />)}
                </datalist>
              </Field>
              <div className="flex flex-wrap gap-1.5">
                {REGION_PRESETS.slice(0, 4).map((r) => (
                  <button key={r} type="button" onClick={() => setForm((f) => ({ ...f, region: r }))}
                    className="px-2.5 py-1 text-xs rounded-full bg-gray-100 text-gray-600 hover:bg-orange-50 hover:text-[#FF6F0F]">
                    {r}
                  </button>
                ))}
              </div>
            </>
          )}

          {err && <p className="text-sm text-red-500 bg-red-50 rounded-lg px-3 py-2.5">{err}</p>}

          <Button size="lg" type="submit" disabled={busy}>
            {busy ? '처리 중…' : mode === 'signup' ? '가입하고 시작하기' : '로그인'}
          </Button>
        </form>

        <button onClick={() => go('/')} className="mt-6 w-full text-sm text-gray-400 hover:text-gray-600">
          로그인 없이 둘러보기
        </button>
      </div>
    </div>
  );
}

    if (category !== '전체') q = q.eq('category', category);
    if (keyword.trim()) q = q.or(`title.ilike.%${keyword.trim()}%,description.ilike.%${keyword.trim()}%`);
    const { data, error } = await q;
    if (error) { console.error(error); setProducts([]); return; }
    setProducts((data ?? []).map((p) => ({ ...p, fav_count: p.carrot_favorites?.[0]?.count ?? 0 })));
  }, [category, keyword]);

  useEffect(() => { setProducts(null); load(); }, [load]);

  return (
    <>

              <button onClick={() => { setSearching(false); setKeyword(''); }}

                {profile?.region ?? '전국'} <span className="text-gray-300">▾</span>
              </h1>
              <button onClick={() => setSearching(true)} className="w-10 h-10 grid place-items-center text-gray-700" aria-label="검색">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.2-3.2" /></svg>
              </button>

        {/* 카테고리 필터 */}
        <div className="flex gap-1.5 px-4 pb-2.5 overflow-x-auto no-scrollbar">
          {['전체', ...CATEGORIES].map((c) => (
            <button key={c} onClick={() => setCategory(c)}

          <Empty

            desc="첫 번째 물건을 등록해 보세요"
            action={<Button onClick={() => go('/new')}>물건 팔기</Button>}

          <div className="fade-up">{products.map((p) => <ProductCard key={p.id} p={p} />)}</div>

      <div className="fixed bottom-20 left-0 right-0 z-20 pointer-events-none">

function ProductFormPage({ editId }) {
  const { user, profile } = useAuth();
  const [form, setForm] = useState({ title: '', price: '', category: '', description: '' });
  const [files, setFiles] = useState([]);          // 새로 고른 File 객체
  const [previews, setPreviews] = useState([]);    // 미리보기 URL
  const [keptUrls, setKeptUrls] = useState([]);    // 수정 시 유지할 기존 이미지 URL
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(!!editId);
  const fileRef = useRef(null);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  // 수정 모드면 기존 값 불러오기
  useEffect(() => {
    if (!editId) return;
    (async () => {
      const { data } = await sb.from('carrot_products').select('*').eq('id', editId).maybeSingle();
      if (data) {
        setForm({ title: data.title, price: String(data.price), category: data.category, description: data.description });
        setKeptUrls(data.images ?? []);
      }
      setLoading(false);
    })();
  }, [editId]);

  const totalImages = keptUrls.length + files.length;

  const onPick = (e) => {
    const picked = Array.from(e.target.files ?? []);
    const room = MAX_IMAGES - totalImages;
    if (room <= 0) return;
    const next = picked.slice(0, room);
    setFiles((f) => [...f, ...next]);
    setPreviews((p) => [...p, ...next.map((f) => URL.createObjectURL(f))]);
    e.target.value = '';
  };

  const removeKept = (i) => setKeptUrls((u) => u.filter((_, idx) => idx !== i));
  const removeNew = (i) => {
    URL.revokeObjectURL(previews[i]);
    setFiles((f) => f.filter((_, idx) => idx !== i));
    setPreviews((p) => p.filter((_, idx) => idx !== i));
  };

  const submit = async (e) => {
    e.preventDefault();
    setErr('');
    if (!form.category) { setErr('카테고리를 선택해 주세요.'); return; }
    setBusy(true);
    try {
      const uploaded = files.length ? await uploadImages(files, user.id) : [];
      const payload = {
        title: form.title.trim(),
        price: parseInt(form.price || '0', 10),
        category: form.category,
        description: form.description.trim(),
        images: [...keptUrls, ...uploaded],
      };
      if (editId) {
        const { error } = await sb.from('carrot_products').update(payload).eq('id', editId);
        if (error) throw error;
        go(`/product/${editId}`);
      } else {
        const { data, error } = await sb.from('carrot_products')
          .insert({ ...payload, user_id: user.id, region: profile?.region ?? '' })
          .select('id').single();
        if (error) throw error;
        go(`/product/${data.id}`);
      }
    } catch (e2) {
      setErr(e2.message || String(e2));
    } finally { setBusy(false); }
  };

  if (loading) return <><TopBar title="내 물건 팔기" onBack={goBack} /><Spinner /></>;

  return (
    <>
      <TopBar title={editId ? '상품 수정' : '내 물건 팔기'} onBack={goBack} />
      <form onSubmit={submit} className="px-4 py-5 space-y-5 pb-28">
        {/* 이미지 (최대 3장) */}
        <div>
          <div className="flex gap-2 overflow-x-auto no-scrollbar">
            <button type="button" onClick={() => fileRef.current?.click()} disabled={totalImages >= MAX_IMAGES}
              className="shrink-0 w-20 h-20 rounded-lg border border-gray-200 grid place-items-center text-gray-400 disabled:opacity-40">
              <div className="text-center leading-tight">
                <div className="text-xl">📷</div>
                <div className="text-[11px] font-semibold mt-0.5">
                  <span className={totalImages > 0 ? 'text-[#FF6F0F]' : ''}>{totalImages}</span>/{MAX_IMAGES}
                </div>
              </div>
            </button>
            {keptUrls.map((u, i) => (
              <div key={`k${i}`} className="relative shrink-0 w-20 h-20">
                <img src={u} alt="" className="w-full h-full object-cover rounded-lg" />
                <button type="button" onClick={() => removeKept(i)}
                  className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-gray-800 text-white text-xs grid place-items-center">×</button>
              </div>
            ))}
            {previews.map((u, i) => (
              <div key={`n${i}`} className="relative shrink-0 w-20 h-20">
                <img src={u} alt="" className="w-full h-full object-cover rounded-lg" />
                <button type="button" onClick={() => removeNew(i)}
                  className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-gray-800 text-white text-xs grid place-items-center">×</button>
              </div>
            ))}
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={onPick} />
        </div>

        <Field label="제목">
          <input className={inputCls} required value={form.title} onChange={set('title')} placeholder="판매할 물건의 이름을 적어주세요" />
        </Field>

        <Field label="카테고리">
          <div className="flex flex-wrap gap-1.5">
            {CATEGORIES.map((c) => (
              <button key={c} type="button" onClick={() => setForm((f) => ({ ...f, category: c }))}
                className={`px-3 py-1.5 rounded-full text-[13px] font-semibold border transition ${
                  form.category === c ? 'bg-[#FF6F0F] text-white border-[#FF6F0F]' : 'bg-white text-gray-600 border-gray-200'
                }`}>{c}</button>
            ))}
          </div>
        </Field>

        <Field label="가격" hint="0원으로 두면 나눔으로 표시돼요">
          <div className="relative">
            <input className={inputCls + ' pr-10'} type="number" min="0" required
              value={form.price} onChange={set('price')} placeholder="0" />
            <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-[15px]">원</span>
          </div>
        </Field>

        <Field label="설명" hint={`${profile?.region ?? ''}에 올릴 게시글이에요`}>
          <textarea className={inputCls + ' min-h-[140px] resize-none'} required
            value={form.description} onChange={set('description')}
            placeholder="상품의 상태, 구매 시기 등을 적어주세요." />
        </Field>

        {err && <p className="text-sm text-red-500 bg-red-50 rounded-lg px-3 py-2.5">{err}</p>}

        <div className="fixed bottom-0 left-0 right-0 z-20">
          <div className="app-bar px-4 py-3 border-t border-gray-100">
            <Button size="lg" type="submit" disabled={busy}>
              {busy ? (files.length ? '이미지 업로드 중…' : '저장 중…') : editId ? '수정 완료' : '작성 완료'}
            </Button>
          </div>
        </div>
      </form>
    </>
  );
}

function ImageSlider({ images }) {
  const [idx, setIdx] = useState(0);
  const ref = useRef(null);
  if (!images?.length) {
    return <div className="aspect-square bg-gray-100 grid place-items-center text-5xl opacity-30">🥕</div>;
  }
  const onScroll = () => {
    const el = ref.current;
    if (el) setIdx(Math.round(el.scrollLeft / el.clientWidth));
  };
  return (
    <div className="relative">
      <div ref={ref} onScroll={onScroll}
        className="flex overflow-x-auto snap-x snap-mandatory no-scrollbar aspect-square">
        {images.map((u, i) => (
          <img key={i} src={u} alt="" className="w-full h-full object-cover shrink-0 snap-center" />
        ))}
      </div>
      {images.length > 1 && (
        <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">
          {images.map((_, i) => (
            <span key={i} className={`w-1.5 h-1.5 rounded-full transition ${i === idx ? 'bg-white' : 'bg-white/40'}`} />
          ))}
        </div>
      )}
    </div>
  );
}

function ProductDetailPage({ id }) {
  const { user, profile } = useAuth();
  const [p, setP] = useState(null);
  const [notFound, setNotFound] = useState(false);
  const [favCount, setFavCount] = useState(0);
  const [faved, setFaved] = useState(false);
  const [busy, setBusy] = useState(false);

  const load = useCallback(async () => {
    const { data } = await sb.from('carrot_products')
      .select('*, seller:carrot_profiles(id, nickname, region)').eq('id', id).maybeSingle();
    if (!data) { setNotFound(true); return; }
    setP(data);
    const { count } = await sb.from('carrot_favorites')
      .select('id', { count: 'exact', head: true }).eq('product_id', id);
    setFavCount(count ?? 0);
    if (user) {
      const { data: mine } = await sb.from('carrot_favorites')
        .select('id').eq('product_id', id).eq('user_id', user.id).maybeSingle();
      setFaved(!!mine);
    }
  }, [id, user]);

  useEffect(() => { load(); }, [load]);

  const isMine = user && p && p.user_id === user.id;

  const toggleFav = async () => {
    if (!user) { go('/login'); return; }
    setBusy(true);
    if (faved) {
      await sb.from('carrot_favorites').delete().eq('product_id', id).eq('user_id', user.id);
      setFaved(false); setFavCount((c) => Math.max(0, c - 1));
    } else {
      await sb.from('carrot_favorites').insert({ product_id: Number(id), user_id: user.id });
      setFaved(true); setFavCount((c) => c + 1);
    }
    setBusy(false);
  };

  // 채팅하기 — 이미 방이 있으면 재사용, 없으면 생성 (Part 4)
  const startChat = async () => {
    if (!user) { go('/login'); return; }
    if (!profile) { go('/onboarding'); return; }
    setBusy(true);
    try {
      const { data: exist } = await sb.from('carrot_chat_rooms')
        .select('id').eq('product_id', id).eq('buyer_id', user.id).maybeSingle();
      if (exist) { go(`/chat/${exist.id}`); return; }
      const { data, error } = await sb.from('carrot_chat_rooms')
        .insert({ product_id: Number(id), buyer_id: user.id, seller_id: p.user_id })
        .select('id').single();
      if (error) throw error;
      go(`/chat/${data.id}`);
    } catch (e) {
      alert('채팅방을 열지 못했어요: ' + (e.message || e));
    } finally { setBusy(false); }
  };

  const toggleSold = async () => {
    const next = p.status === 'sold' ? 'selling' : 'sold';
    await sb.from('carrot_products').update({ status: next }).eq('id', id);
    setP((prev) => ({ ...prev, status: next }));
  };

  const remove = async () => {
    if (!confirm('이 상품을 삭제할까요? 되돌릴 수 없어요.')) return;
    const { error } = await sb.from('carrot_products').delete().eq('id', id);
    if (error) { alert(error.message); return; }
    go('/');
  };

  if (notFound) return <><TopBar title="상품" onBack={goBack} /><Empty icon="🫥" title="삭제되었거나 없는 상품이에요" /></>;
  if (!p) return <><TopBar title="상품" onBack={goBack} /><Spinner /></>;

  return (
    <>
      <TopBar title="" onBack={goBack} right={
        isMine ? (
          <div className="flex gap-1 pr-1">
            <Button size="sm" variant="subtle" onClick={() => go(`/edit/${id}`)}>수정</Button>
            <Button size="sm" variant="danger" onClick={remove}>삭제</Button>
          </div>
        ) : null
      } />

      <div className="pb-24">
        <ImageSlider images={p.images} />

        {/* 판매자 */}
        <div className="flex items-center gap-3 px-4 py-4 border-b border-gray-100">
          <div className="w-10 h-10 rounded-full bg-orange-100 grid place-items-center text-lg">🥕</div>
          <div className="flex-1 min-w-0">
            <p className="font-bold text-[15px] text-gray-900 truncate">{p.seller?.nickname ?? '알 수 없음'}</p>
            <p className="text-[13px] text-gray-400 truncate">{p.region || p.seller?.region}</p>
          </div>
          {isMine && (
            <Button size="sm" variant="outline" onClick={toggleSold}>
              {p.status === 'sold' ? '판매중으로' : '거래완료로'}
            </Button>
          )}
        </div>

        {/* 정보 */}
        <div className="px-4 py-5">
          {p.status === 'sold' && (
            <span className="inline-block mb-2 px-2 py-1 rounded bg-gray-600 text-white text-xs font-bold">거래완료</span>
          )}
          <h2 className="text-xl font-bold text-gray-900 leading-snug">{p.title}</h2>
          <p className="mt-1.5 text-[13px] text-gray-400">
            {p.category} · {timeAgo(p.created_at)}
          </p>
          <p className="mt-3 text-[22px] font-extrabold text-gray-900">{won(p.price)}</p>
          <p className="mt-5 text-[15px] text-gray-800 leading-relaxed whitespace-pre-wrap">{p.description}</p>
          <p className="mt-6 text-[13px] text-gray-400">관심 {favCount}</p>
        </div>
      </div>

      {/* 하단 액션바 */}
      <div className="fixed bottom-0 left-0 right-0 z-20">
        <div className="app-bar flex items-center gap-3 px-4 py-3 border-t border-gray-100">
          <button onClick={toggleFav} disabled={busy}
            className={`w-11 h-11 shrink-0 grid place-items-center rounded-lg border transition ${
              faved ? 'border-[#FF6F0F] text-[#FF6F0F] bg-orange-50' : 'border-gray-200 text-gray-400'
            }`} aria-label="관심">
            <svg className={faved ? 'pop' : ''} width="24" height="24" viewBox="0 0 24 24"
              fill={faved ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1L12 21.2l7.7-7.7 1.1-1a5.5 5.5 0 000-7.9z" />
            </svg>
          </button>
          <div className="w-px h-8 bg-gray-100" />
          <div className="flex-1">
            <p className="font-extrabold text-[17px] text-gray-900 leading-tight">{won(p.price)}</p>
          </div>
          {isMine ? (
            <Button onClick={() => go('/chats')}>채팅 목록</Button>
          ) : (
            <Button onClick={startChat} disabled={busy}>채팅하기</Button>
          )}
        </div>
      </div>
    </>
  );
}

// 💬 채팅 목록 + 1:1 채팅방 (폴링)  (Part 4)

async function fetchMyRooms(uid) {
  const { data, error } = await sb.from('carrot_chat_rooms')
    .select(`id, created_at, product_id, buyer_id, seller_id,
             product:carrot_products(id, title, price, images, status),
             buyer:carrot_profiles!carrot_chat_rooms_buyer_id_fkey(id, nickname, region),
             seller:carrot_profiles!carrot_chat_rooms_seller_id_fkey(id, nickname, region)`)
    .or(`buyer_id.eq.${uid},seller_id.eq.${uid}`)
    .order('created_at', { ascending: false });
  if (error) { console.error(error); return []; }
  const rooms = data ?? [];
  if (!rooms.length) return [];

  // 방별 마지막 메시지 — 방 목록 미리보기용
  const { data: msgs } = await sb.from('carrot_messages')
    .select('room_id, content, created_at, sender_id')
    .in('room_id', rooms.map((r) => r.id))
    .order('created_at', { ascending: false });
  const last = {};
  (msgs ?? []).forEach((m) => { if (!last[m.room_id]) last[m.room_id] = m; });

  return rooms
    .map((r) => ({ ...r, last: last[r.id] ?? null, opponent: r.buyer_id === uid ? r.seller : r.buyer }))
    .sort((a, b) => new Date(b.last?.created_at ?? b.created_at) - new Date(a.last?.created_at ?? a.created_at));
}

function ChatListPage() {

    const t = setInterval(run, POLL_MS * 2);   // 목록은 조금 느슨하게 폴링
    return () => { alive = false; clearInterval(t); };

  if (!user) return <Empty icon="🔒" title="로그인이 필요해요" action={<Button onClick={() => go('/login')}>로그인하기</Button>} />;

  const bottomRef = useRef(null);
  const lastIdRef = useRef(0);

  // 방 정보 (RLS 상 참여자가 아니면 아무것도 안 나온다)
  useEffect(() => {
    if (!user) return;
    (async () => {
      const { data } = await sb.from('carrot_chat_rooms')
        .select(`id, product_id, buyer_id, seller_id,
                 product:carrot_products(id, title, price, images, status),
                 buyer:carrot_profiles!carrot_chat_rooms_buyer_id_fkey(id, nickname),
                 seller:carrot_profiles!carrot_chat_rooms_seller_id_fkey(id, nickname)`)
        .eq('id', roomId).maybeSingle();
      if (!data) { setDenied(true); return; }
      setRoom({ ...data, opponent: data.buyer_id === user.id ? data.seller : data.buyer });
    })();
  }, [roomId, user]);

  // 폴링 — 마지막으로 받은 id 이후의 메시지만 가져온다
  useEffect(() => {
    if (!user || !room) return;
    let alive = true;
    const poll = async () => {
      const { data } = await sb.from('carrot_messages')
        .select('*').eq('room_id', roomId)
        .gt('id', lastIdRef.current)
        .order('created_at', { ascending: true });
      if (!alive || !data?.length) return;
      lastIdRef.current = data[data.length - 1].id;
      setMessages((prev) => {
        const seen = new Set(prev.map((m) => m.id));
        return [...prev, ...data.filter((m) => !seen.has(m.id))];
      });
    };
    poll();
    const t = setInterval(poll, POLL_MS);
    return () => { alive = false; clearInterval(t); };
  }, [roomId, user, room]);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages.length]);

  const send = async (e) => {
    e.preventDefault();
    const content = text.trim();
    if (!content || sending) return;
    setSending(true);
    setText('');
    const { data, error } = await sb.from('carrot_messages')
      .insert({ room_id: Number(roomId), sender_id: user.id, content })
      .select('*').single();
    setSending(false);
    if (error) { alert('전송 실패: ' + error.message); setText(content); return; }
    lastIdRef.current = Math.max(lastIdRef.current, data.id);
    setMessages((prev) => (prev.some((m) => m.id === data.id) ? prev : [...prev, data]));
  };

  if (!user) return <Empty icon="🔒" title="로그인이 필요해요" action={<Button onClick={() => go('/login')}>로그인하기</Button>} />;
  if (denied) return <><TopBar title="채팅" onBack={goBack} /><Empty icon="🚫" title="참여할 수 없는 채팅방이에요" /></>;
  if (!room) return <><TopBar title="채팅" onBack={goBack} /><Spinner /></>;

  return (
    <div className="flex flex-col h-screen">
      <TopBar title={room.opponent?.nickname ?? '채팅'} onBack={goBack} />

      {/* 거래 상품 요약 */}
      {room.product && (
        <button onClick={() => go(`/product/${room.product.id}`)}
          className="flex items-center gap-3 px-4 py-3 bg-gray-50 border-b border-gray-100 text-left">
          {room.product.images?.[0]
            ? <img src={room.product.images[0]} alt="" className="w-10 h-10 rounded object-cover" />
            : <div className="w-10 h-10 rounded bg-gray-200 grid place-items-center text-sm">🥕</div>}
          <div className="flex-1 min-w-0">
            <p className="text-[14px] text-gray-800 truncate">{room.product.title}</p>
            <p className="text-[13px] font-bold text-gray-900">{won(room.product.price)}</p>
          </div>
        </button>
      )}

      {/* 메시지 */}
      <div className="flex-1 overflow-y-auto px-4 py-4 space-y-2 bg-white">
        {messages.length === 0 && (
          <p className="text-center text-[13px] text-gray-400 py-10">
            첫 메시지를 보내 대화를 시작해 보세요
          </p>
        )}
        {messages.map((m) => {
          const mine = m.sender_id === user.id;
          return (
            <div key={m.id} className={`flex items-end gap-1.5 ${mine ? 'justify-end' : 'justify-start'}`}>
              {mine && <span className="text-[11px] text-gray-400 shrink-0">{clockTime(m.created_at)}</span>}
              <div className={`max-w-[72%] px-3.5 py-2.5 text-[14.5px] leading-relaxed whitespace-pre-wrap break-words ${
                mine ? 'bg-[#FF6F0F] text-white rounded-2xl rounded-br-md' : 'bg-gray-100 text-gray-900 rounded-2xl rounded-bl-md'
              }`}>{m.content}</div>
              {!mine && <span className="text-[11px] text-gray-400 shrink-0">{clockTime(m.created_at)}</span>}
            </div>
          );
        })}
        <div ref={bottomRef} />
      </div>

      {/* 입력 */}
      <form onSubmit={send} className="flex items-center gap-2 px-3 py-2.5 border-t border-gray-100 bg-white">
        <input value={text} onChange={(e) => setText(e.target.value)} placeholder="메시지 보내기"
          className="flex-1 px-4 py-2.5 bg-gray-100 rounded-full text-[15px] focus:outline-none" />
        <button type="submit" disabled={!text.trim() || sending}
          className="w-10 h-10 shrink-0 rounded-full bg-[#FF6F0F] text-white grid place-items-center disabled:opacity-30">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" /></svg>
        </button>
      </form>
    </div>
  );
}

// ============================================================
// 👤 마이페이지 — 내 상품 / 관심 상품 / 채팅  (Part 5)
// ============================================================
function MyPage() {
  const { user, profile, signOut } = useAuth();
  const [tab, setTab] = useState('mine');
  const [mine, setMine] = useState(null);
  const [favs, setFavs] = useState(null);
  const [rooms, setRooms] = useState(null);

  useEffect(() => {
    if (!user) return;
    (async () => {
      const { data: m } = await sb.from('carrot_products')
        .select('*, seller:carrot_profiles(nickname, region)')
        .eq('user_id', user.id).order('created_at', { ascending: false });
      setMine(m ?? []);

      const { data: f } = await sb.from('carrot_favorites')
        .select('id, created_at, product:carrot_products(*, seller:carrot_profiles(nickname, region))')
        .eq('user_id', user.id).order('created_at', { ascending: false });
      setFavs((f ?? []).map((x) => x.product).filter(Boolean));

      setRooms(await fetchMyRooms(user.id));
    })();
  }, [user]);

  if (!user) {
    return (
      <>
        <TopBar title="나의 당근" />
        <Empty icon="🔒" title="로그인이 필요해요" desc="로그인하면 내 상품과 관심목록을 볼 수 있어요"
          action={<Button onClick={() => go('/login')}>로그인하기</Button>} />
      </>
    );
  }

  const tabs = [
    ['mine', `판매 상품 ${mine?.length ?? 0}`],
    ['fav', `관심 목록 ${favs?.length ?? 0}`],
    ['chat', `채팅 ${rooms?.length ?? 0}`],
  ];

  return (
    <>
      <TopBar title="나의 당근" right={
        <button onClick={async () => { await signOut(); go('/'); }}
          className="px-3 py-1.5 mr-1 text-[13px] font-semibold text-gray-500 hover:text-gray-800">로그아웃</button>
      } />

      {/* 프로필 */}
      <div className="flex items-center gap-3 px-4 py-5 border-b border-gray-100">
        <div className="w-14 h-14 rounded-full bg-orange-100 grid place-items-center text-2xl">🥕</div>
        <div className="flex-1 min-w-0">
          <p className="font-bold text-[17px] text-gray-900 truncate">{profile?.nickname ?? '이름 없음'}</p>
          <p className="text-[13px] text-gray-400 truncate">📍 {profile?.region ?? '동네 미설정'}</p>
          <p className="text-[12px] text-gray-300 truncate">{user.email}</p>
        </div>
      </div>

      {/* 탭 */}
      <div className="flex border-b border-gray-100 sticky top-14 bg-white z-20">
        {tabs.map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)}
            className={`flex-1 py-3 text-[14px] font-bold border-b-2 transition ${
              tab === k ? 'border-[#FF6F0F] text-gray-900' : 'border-transparent text-gray-400'
            }`}>{label}</button>
        ))}
      </div>

      {tab === 'mine' && (
        mine === null ? <Spinner />
          : mine.length === 0 ? <Empty title="등록한 상품이 없어요" action={<Button onClick={() => go('/new')}>물건 팔기</Button>} />
          : <div className="fade-up">{mine.map((p) => <ProductCard key={p.id} p={p} />)}</div>
      )}

      {tab === 'fav' && (
        favs === null ? <Spinner />
          : favs.length === 0 ? <Empty icon="♡" title="관심 상품이 없어요" desc="마음에 드는 물건에 하트를 눌러보세요" />
          : <div className="fade-up">{favs.map((p) => <ProductCard key={p.id} p={p} />)}</div>
      )}

      {tab === 'chat' && (
        rooms === null ? <Spinner />
          : rooms.length === 0 ? <Empty icon="💬" title="채팅 내역이 없어요" />
          : (
            <div className="fade-up">
              {rooms.map((r) => (
                <button key={r.id} onClick={() => go(`/chat/${r.id}`)}
                  className="w-full flex gap-3 px-4 py-4 text-left border-b border-gray-100 hover:bg-gray-50">
                  <div className="w-11 h-11 shrink-0 rounded-full bg-orange-100 grid place-items-center text-lg">🥕</div>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-[15px] text-gray-900 truncate">{r.opponent?.nickname ?? '상대방'}</p>
                    <p className="mt-0.5 text-[14px] text-gray-500 truncate">{r.last?.content ?? '대화를 시작해 보세요'}</p>
                  </div>
                  <p className="text-[12px] text-gray-400 shrink-0">{timeAgo(r.last?.created_at ?? r.created_at)}</p>
                </button>
              ))}
            </div>
          )
      )}
    </>
  );
}

// ============================================================
// 🧭 라우터
// ============================================================
function App() {
  const { user, profile, loading } = useAuth();
  const route = useHashRoute();

  if (loading) {
    return <div className="app-shell min-h-screen grid place-items-center"><Spinner /></div>;
  }

  // 로그인은 했는데 프로필(동네)이 없는 계정 → 온보딩
  if (user && !profile && route !== '/login') {
    return <OnboardingPage />;
  }

  if (route === '/login') return <AuthPage />;
  if (route === '/onboarding') return <OnboardingPage />;

  // 로그인이 필요한 화면 가드
  const needsAuth = ['/new'].includes(route) || route.startsWith('/edit/');
  if (needsAuth && !user) return <AuthPage />;

  let page, showTabs = false, tabKey = route;
  if (route === '/') { page = <HomePage />; showTabs = true; }
  else if (route === '/chats') { page = <ChatListPage />; showTabs = true; }
  else if (route === '/my') { page = <MyPage />; showTabs = true; }
  else if (route === '/new') page = <ProductFormPage />;
  else if (route.startsWith('/edit/')) page = <ProductFormPage editId={route.split('/')[2]} />;
  else if (route.startsWith('/product/')) page = <ProductDetailPage id={route.split('/')[2]} />;
  else if (route.startsWith('/chat/')) return <div className="app-shell"><ChatRoomPage roomId={route.split('/')[2]} /></div>;
  else { page = <Empty icon="🧭" title="없는 페이지예요" action={<Button onClick={() => go('/')}>홈으로</Button>} />; showTabs = true; tabKey = '/'; }

  return (
    <div className="app-shell flex flex-col min-h-screen">
      <div className="flex-1">{page}</div>
      {showTabs && <TabBar current={tabKey} unread={0} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthProvider><App /></AuthProvider>
);
  </script>
</body>
