  <style>
    /* ── 오로라 팔레트 (민트 → 시안 → 블루 → 퍼플) ── */
    :root {
      --g1:#5EEAD4; --g2:#38BDF8; --g3:#4F46E5; --g4:#6D28D9;
      --aurora: linear-gradient(180deg, var(--g1) 0%, var(--g2) 34%, var(--g3) 70%, var(--g4) 100%);
      --ink:#0B1020; --mist:rgba(255,255,255,.72);
    }
    body { font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--ink); }
    .display { font-family:'Outfit','Pretendard',sans-serif; letter-spacing:-.02em; }
    .mono-tag { font-family:'Outfit',monospace; font-variant-numeric:tabular-nums; letter-spacing:.06em; }

    #map { height:100%; width:100%; transition:background .4s ease; }
    #map.real    { background:#bfe3ee; }
    #map.scratch { background:#140F2E; }          /* 그라데이션 끝단과 이어지는 딥 퍼플 바다 */

    /* 방문지 핀 — 대륙 색 2톤 그라데이션(작은 요소) */
    .pin { display:flex; align-items:center; justify-content:center; width:34px; height:34px;
      background:linear-gradient(150deg, var(--c,#818CF8), var(--c2,#4F46E5)); border:3px solid #fff;
      border-radius:50% 50% 50% 0; transform:rotate(-45deg);
      box-shadow:0 3px 10px rgba(11,16,32,.35); font-size:15px; }
    .pin span { transform:rotate(45deg); }
    .pin.active { transform:rotate(-45deg) scale(1.28);
      box-shadow:0 0 0 4px rgba(255,255,255,.55),0 6px 16px rgba(11,16,32,.45); z-index:1000; }

    /* 국가명 라벨 */
    .ctry-label { background:transparent; border:none; box-shadow:none; padding:0;
      font-family:'Outfit','Pretendard',sans-serif; font-weight:600; font-size:11px;
      letter-spacing:.02em; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.75); }
    .ctry-label::before { display:none; }
    .leaflet-tooltip.ctry-label { white-space:nowrap; }

    /* hover 글로우 — 대륙 컬러와 안 겹치는 화이트/잉크 톤 */
    #map.scratch .ctry-hover { filter:drop-shadow(0 0 8px rgba(255,255,255,.8)); }
    #map.real    .ctry-hover { filter:drop-shadow(0 0 6px rgba(16,21,39,.5)); }
    #map.adding  { cursor:crosshair; }

    /* 경로 경유지 순번 배지 (핀 위에 겹치지 않게 위로 살짝) */
    .rnum { width:18px; height:18px; border-radius:50%; background:#4F46E5; color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-family:'Outfit',sans-serif; font-size:10px; font-weight:700;
      border:2px solid #fff; box-shadow:0 2px 6px rgba(11,16,32,.35); }

    /* 경로 패널 드래그 */
    .rstop { transition:background .15s; }
    .rstop.dragging { opacity:.4; }
    .rstop.dragover { box-shadow:inset 0 2.5px 0 #4F46E5; }

    /* 방문지 저장 직후 '긁어내는' 리빌 — 좌상단→우하단 대각선 와이프 + 화이트 광택 */
    @keyframes scratchReveal {
      0%   { clip-path:polygon(-30% -30%, 25% -30%, -30% 25%); filter:drop-shadow(0 0 14px rgba(255,255,255,.95)); }
      70%  { filter:drop-shadow(0 0 10px rgba(255,255,255,.7)); }
      100% { clip-path:polygon(-30% -30%, 330% -30%, -30% 330%); filter:none; }

    #map .ctry-scratched { animation:scratchReveal 1.1s cubic-bezier(.25,.7,.3,1) both; }

    /* 클릭 시 브라우저 기본 포커스 링(사각형) 제거 —

    #map .leaflet-interactive:focus { outline:none; }

    /* 그라데이션은 '작은 요소'에만 — 로고 배지 / 14% 숫자 / 진행바. 그 외엔 팔레트 단색 */

    /* 포스트카드 카드 — 절취선(퍼포레이션) */
    .postcard { border-radius:18px; overflow:hidden; background:#fff; border:1px solid #e7eaf3;

    .postcard:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(11,16,32,.12); }

    .perf { height:0; border-top:1.5px dashed rgba(11,16,32,.16); position:relative; }
    .perf::before, .perf::after { content:""; position:absolute; top:-6px; width:12px; height:12px;

    .perf::before { left:-6px; } .perf::after { right:-6px; }

    /* 모드 토글 */
    .seg { background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-radius:999px; padding:3px;
      box-shadow:0 6px 18px rgba(11,16,32,.22); display:inline-flex; gap:2px; }
    .seg button { border:none; background:transparent; font-size:12px; font-weight:600; color:#5b6478;
      padding:6px 14px; border-radius:999px; cursor:pointer; transition:all .2s; font-family:'Outfit','Pretendard',sans-serif; }
    .seg button.on { background:var(--g3); color:#fff; }

    /* 폼 */
    .inp { width:100%; border:1px solid #dfe3ee; border-radius:12px; padding:10px 12px; font-size:14px; background:#fff; }
    .inp:focus { outline:3px solid rgba(79,70,229,.18); border-color:var(--g3); }
    .btn-p { background:var(--g3); color:#fff; font-weight:600;
      border-radius:12px; padding:11px 16px; font-size:14px; transition:background .2s; }
    .btn-p:hover:not(:disabled) { background:#4338CA; }
    .btn-p:disabled { opacity:.5; }
    .btn-ghost { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); color:#fff;
      font-weight:600; border-radius:12px; padding:11px 16px; font-size:14px; transition:background .2s; }
    .btn-ghost:hover { background:rgba(255,255,255,.28); }

    /* 모바일: iOS가 입력 포커스 시 확대되지 않도록 16px 보장 */
    @media (max-width:767px) { .inp { font-size:16px; } }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ── Supabase (프론트온리 · publishable 키 · 보안은 RLS가 담당) ──
    const SUPABASE_URL = "https://ibxhnwovdtnfttfzqpos.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7RB2j_pC9YcoPG5N1n8uZg_p12ndXjr";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const GEO_URL = "https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json";

    // 구글 평점 기능 표시 여부 — GOOGLE_PLACES_KEY 연결 전까지 숨김 (구조·캐시는 유지)
    const SHOW_RATINGS = false;
    // 소셜 로그인 버튼 — Supabase 대시보드에 구글/카카오 client ID·secret 등록 후 true로
    const SHOW_SOCIAL = false;

    // 여행 그룹 색 (경로 라인·순번 배지·섹션 도트)
    const TRIP_COLORS = ["#38BDF8","#A78BFA","#F472B6","#34D399","#FB923C","#F87171","#818CF8","#2DD4BF"];

    // 인스타 게시글 URL → 임베드 주소 (공개 게시글/릴스만, API 불필요)
    const instaEmbed = (url) => {
      const m = String(url || "").match(/instagram\.com\/(p|reel)\/([A-Za-z0-9_-]+)/);
      return m ? `https://www.instagram.com/${m[1]}/${m[2]}/embed` : null;
    };

    // ── 태평양 중심 지도 ──
    // 표준 지도는 경도 ±180에서 끊겨 한국 중심 뷰에서 아메리카 쪽 벡터가 사라진다.
    // 대서양(-30°)에서 지도를 자르고, 그보다 서쪽 조각(아메리카·그린란드)은 +360 이동.
    const PACIFIC_CUT = -30;
    const dispLng = (l) => l < PACIFIC_CUT ? l + 360 : l;           // 저장 좌표(-180~180) → 표시 좌표
    const normLng = (l) => ((l + 540) % 360) - 180;                  // 표시 좌표 → 저장 좌표

    // GeoJSON을 태평양 중심 좌표계로 변환 (폴리곤 조각 단위로 이동 → 나라가 찢기지 않음)
    function pacifyGeo(geo) {
      const shiftRing = (ring) => {
        let xs = ring.map(c => c[0]);
        // ① 링 자체가 날짜변경선을 걸치면(러시아·알래스카) 먼저 이어붙임
        if (Math.max(...xs) - Math.min(...xs) > 180) {
          ring = ring.map(([x, y]) => [x < 0 ? x + 360 : x, y]);
          xs = ring.map(c => c[0]);
        }
        // ② 조각의 중심이 컷 라인 서쪽이면 통째로 +360 (아메리카를 오른쪽으로)
        const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
        if (cx < PACIFIC_CUT) ring = ring.map(([x, y]) => [x + 360, y]);
        return ring;
      };
      // 남극은 극지방을 감싸는 링이라 변환 시 찢어짐 + 여행 대상도 아님 → 제외
      geo.features = geo.features.filter(f => f.properties.name !== "Antarctica");
      geo.features.forEach(f => {
        const g = f.geometry;
        if (g.type === "Polygon") g.coordinates = g.coordinates.map(shiftRing);
        else if (g.type === "MultiPolygon") g.coordinates = g.coordinates.map(rings => rings.map(shiftRing));
      });
      return geo;
    }

    // 국가명 라벨 위치: 가장 큰 본토 조각의 bbox 중심.
    // 멀티폴리곤(러시아·미국 등)은 Leaflet 기본 중심이 구석/타국으로 밀리고,
    // 날짜변경선(±180°)을 걸치면 중심이 반대편으로 튐 → 경도 +360 정규화 후 계산.
    function countryLabelPoint(f) {
      try {
        const g = f.geometry;
        const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
        let best = null, bestArea = 0;
        polys.forEach(rings => {
          const ring = rings[0];                              // 외곽 링만
          let xs = ring.map(c => c[0]);
          const minX0 = Math.min(...xs), maxX0 = Math.max(...xs);
          if (maxX0 - minX0 > 180) xs = xs.map(x => x < 0 ? x + 360 : x);   // 날짜변경선 보정
          const ys = ring.map(c => c[1]);
          const minX = Math.min(...xs), maxX = Math.max(...xs);
          const minY = Math.min(...ys), maxY = Math.max(...ys);
          const area = (maxX - minX) * (maxY - minY);
          if (area > bestArea) {
            bestArea = area;
            // 태평양 중심 좌표계라 lng > 180 그대로 사용 (Leaflet은 범위 밖 경도 허용)
            best = L.latLng((minY + maxY) / 2, (minX + maxX) / 2);
          }
        });
        return best;
      } catch { return null; }
    }

    // ISO3 → [한글명, 국기, 대륙]  (없으면 영문명 + 🌍 + 기타)
    const META = {
      KOR:["대한민국","🇰🇷","아시아"], JPN:["일본","🇯🇵","아시아"], CHN:["중국","🇨🇳","아시아"], TWN:["대만","🇹🇼","아시아"],
      THA:["태국","🇹🇭","아시아"], VNM:["베트남","🇻🇳","아시아"], SGP:["싱가포르","🇸🇬","아시아"], MYS:["말레이시아","🇲🇾","아시아"],
      IDN:["인도네시아","🇮🇩","아시아"], PHL:["필리핀","🇵🇭","아시아"], IND:["인도","🇮🇳","아시아"], NPL:["네팔","🇳🇵","아시아"],
      ARE:["아랍에미리트","🇦🇪","아시아"], MNG:["몽골","🇲🇳","아시아"], LKA:["스리랑카","🇱🇰","아시아"], TUR:["튀르키예","🇹🇷","유럽"],
      FRA:["프랑스","🇫🇷","유럽"], GBR:["영국","🇬🇧","유럽"], DEU:["독일","🇩🇪","유럽"], ITA:["이탈리아","🇮🇹","유럽"],
      ESP:["스페인","🇪🇸","유럽"], PRT:["포르투갈","🇵🇹","유럽"], NLD:["네덜란드","🇳🇱","유럽"], BEL:["벨기에","🇧🇪","유럽"],
      CHE:["스위스","🇨🇭","유럽"], AUT:["오스트리아","🇦🇹","유럽"], CZE:["체코","🇨🇿","유럽"], HUN:["헝가리","🇭🇺","유럽"],
      POL:["폴란드","🇵🇱","유럽"], GRC:["그리스","🇬🇷","유럽"], HRV:["크로아티아","🇭🇷","유럽"], SWE:["스웨덴","🇸🇪","유럽"],
      NOR:["노르웨이","🇳🇴","유럽"], FIN:["핀란드","🇫🇮","유럽"], DNK:["덴마크","🇩🇰","유럽"], ISL:["아이슬란드","🇮🇸","유럽"],
      IRL:["아일랜드","🇮🇪","유럽"], RUS:["러시아","🇷🇺","유럽"],
      USA:["미국","🇺🇸","북미"], CAN:["캐나다","🇨🇦","북미"], MEX:["멕시코","🇲🇽","북미"],
      BRA:["브라질","🇧🇷","남미"], ARG:["아르헨티나","🇦🇷","남미"], PER:["페루","🇵🇪","남미"], CHL:["칠레","🇨🇱","남미"],
      AUS:["호주","🇦🇺","오세아니아"], NZL:["뉴질랜드","🇳🇿","오세아니아"],
      EGY:["이집트","🇪🇬","아프리카"], MAR:["모로코","🇲🇦","아프리카"], ZAF:["남아프리카공화국","🇿🇦","아프리카"], KEN:["케냐","🇰🇪","아프리카"],
    };
    const metaOf = (iso3, engName) => META[iso3] || [engName, "🌍", "기타"];

    // 사용자 입력이 Leaflet 팝업/핀 HTML에 들어가므로 이스케이프 (공유 지도 = 타인 입력)
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));

    // ── 도시 검색: 우리 도시 DB(tm_cities) 먼저 → 없으면 OSM Nominatim ──
    async function searchCities(q) {
      const safe = q.replace(/[%,()]/g, " ").trim();
      if (!safe) return [];
      const out = [];

      const { data } = await sb.from("tm_cities").select("*")
        .or(`name.ilike.%${safe}%,display.ilike.%${safe}%`)
        .order("hits", { ascending:false }).limit(5);
      (data || []).forEach(c => out.push({
        osm_id:c.osm_id, name:c.name, display:c.display, lat:c.lat, lng:c.lng,
        country:c.country, country_code:c.country_code, cached:true,
      }));

      // 도시·행정구역을 POI(역 출입구 등)보다 위로 올리는 랭킹
      const RANK = { city:0, town:0, village:0, municipality:0, borough:0,
                     province:1, state:1, county:1, region:1, administrative:1,
                     island:2, suburb:2, neighbourhood:3 };
      const rankOf = p => RANK[p.addresstype] ?? RANK[p.type] ?? 6;

      // 같은 이름·거의 같은 좌표는 하나로 접기 (역 출구 N개 방지)
      // — 도시 DB에서 이미 나온 결과도 시드해 OSM 중복(같은 osm_id → key 충돌) 방지
      const seen = new Set(), seenIds = new Set();
      out.forEach(c => { seenIds.add(c.osm_id); seen.add(`${c.name}@${c.lat.toFixed(2)},${c.lng.toFixed(2)}`); });
      const add = (p) => {
        if (p.osm_id != null && seenIds.has(p.osm_id)) return;
        const name = p.name || String(p.display_name).split(",")[0];
        const lat = parseFloat(p.lat), lng = parseFloat(p.lon);
        const key = `${name}@${lat.toFixed(2)},${lng.toFixed(2)}`;
        if (seen.has(key)) return;
        seen.add(key);
        out.push({
          osm_id: p.osm_id, name, display: p.display_name, lat, lng,
          country: p.address?.country || null,
          country_code: (p.address?.country_code || "").toUpperCase(),
          cached: false,
        });
      };

      try {
        const url = "https://nominatim.openstreetmap.org/search"
          + `?q=${encodeURIComponent(safe)}&format=jsonv2&addressdetails=1&accept-language=ko&limit=10`;
        const js = await (await fetch(url)).json();
        js.sort((a, b) => rankOf(a) - rankOf(b));   // 도시 먼저
        js.forEach(add);
      } catch (e) { /* 지오코딩 실패해도 DB 결과는 유지 */ }

      return out.slice(0, 8);
    }

    // 고른 도시를 도시 DB에 기록(중복이면 hits +1)

      });

    // ─────────────────────────── 방문지 추가 모달 ───────────────────────────
    function AddModal({ pending, trips, onClose, onSaved }) {
      const [q, setQ] = useState("");                 // 도시 검색어 (자연어)
      const [results, setResults] = useState([]);
      const [city, setCity] = useState(null);         // 선택된 도시(좌표 포함)
      const [searching, setSearching] = useState(false);
      const [date, setDate] = useState("");
      // 기본값 = 가장 최근 여행 (한 여행의 도시들을 연속으로 추가하는 흐름)
      const [tripSel, setTripSel] = useState(trips[0]?.id || "");   // ""=여행 없음 | trip id | "__new"
      const [newTrip, setNewTrip] = useState("");
      const [title, setTitle] = useState("");
      const [body, setBody] = useState("");
      const [insta, setInsta] = useState("");
      const [file, setFile] = useState(null);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState("");
      const [ko, flag, continent] = metaOf(pending.iso3, pending.country);

      // 자연어 입력 → 디바운스 후 도시 검색
      useEffect(() => {
        if (city || !q.trim()) { setResults([]); return; }
        const t = setTimeout(async () => {
          setSearching(true);
          try { setResults(await searchCities(q)); } finally { setSearching(false); }
        }, 450);
        return () => clearTimeout(t);
      }, [q, city]);

      const save = async (e) => {
        e.preventDefault(); setBusy(true); setErr("");
        try {
          const cityName = city?.name || q.trim();
          if (!cityName) throw new Error("도시를 입력하세요.");
          // 좌표: 검색으로 고른 도시 우선, 없으면 클릭 지점
          const lat = city ? city.lat : pending.lat;
          const lng = city ? city.lng : pending.lng;
          if (city) rememberCity(city);           // 도시 DB에 축적

          // 여행 그룹: 새 여행이면 먼저 생성 (색은 순번대로 자동 배정)
          let trip_id = tripSel && tripSel !== "__new" ? tripSel : null;
          if (tripSel === "__new") {
            if (!newTrip.trim()) throw new Error("새 여행의 이름을 입력해주세요.");

              title: newTrip.trim(), color: TRIP_COLORS[trips.length % TRIP_COLORS.length],
              started_at: date || null,
            }).select().single();
            if (eT) throw eT;
            trip_id = trip.id;
          }

          const { data: place, error: e1 } = await sb.from("tm_places").insert({
            country: pending.country, country_ko: ko, city: cityName, flag, continent,
            lat, lng, visited_at: date || null, trip_id,
          }).select().single();
          if (e1) throw e1;

          // 제목 없이 사진/본문만 있어도 버리지 않고 저장 (제목은 도시명으로 대체)
          if (title.trim() || body.trim() || file) {
            let photo_url = null;
            if (file) {
              const { data:{ user } } = await sb.auth.getUser();
              const path = `${user.id}/${place.id}-${file.name.replace(/[^\w.]/g,"_")}`;
              const { error: e2 } = await sb.storage.from("trip-photos").upload(path, file, { upsert:true });
              if (e2) throw e2;
              photo_url = sb.storage.from("trip-photos").getPublicUrl(path).data.publicUrl;
            }
            const { error: e3 } = await sb.from("tm_diary_entries")
              .insert({ place_id: place.id, title: title.trim() || cityName, body, photo_url,
                        insta_url: insta.trim() || null });
            if (e3) throw e3;
          }
          onSaved();
        } catch (ex) {
          setErr(ex.message?.includes("duplicate") ? "이미 등록한 도시예요." : (ex.message || "저장 실패"));
          setBusy(false);
        }
      };

      return (
        <div className="fixed inset-0 z-[1000] bg-black/50 flex items-center justify-center px-4" onClick={onClose}>
          <form onClick={e=>e.stopPropagation()} onSubmit={save}
            className="fade-in bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
            <div className="px-5 py-4 bg-gradient-to-br from-[#4F46E5] to-[#6D28D9] text-white">
              <div className="text-3xl">{flag}</div>
              <div className="display font-bold text-lg mt-1">{ko}</div>
              <div className="text-xs opacity-80">{pending.country} · {continent}</div>
            </div>
            <div className="p-5 space-y-3">
              <div className="relative">
                <label className="text-xs font-semibold text-[#5b6478]">도시 * <span className="font-normal text-[#9aa2b5]">— 자연어로 검색하세요</span></label>
                {city ? (
                  <div className="mt-1 flex items-start gap-2 bg-white border border-[#4F46E5] rounded-[10px] px-3 py-2">
                    <span className="text-[#4F46E5] mt-0.5">📍</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-semibold text-[#101527]">{city.name}</div>
                      <div className="text-[11px] text-[#5b6478] truncate">{city.display}</div>
                      <div className="text-[10px] text-[#4F46E5] mt-0.5">
                        {city.lat.toFixed(4)}, {city.lng.toFixed(4)} {city.cached ? "· 도시 DB" : "· OSM"}
                      </div>
                    </div>
                    <button type="button" onClick={()=>{ setCity(null); setQ(""); }}
                      className="text-xs text-[#5b6478] hover:text-[#e11d48]">변경</button>
                  </div>
                ) : (
                  <input className="inp mt-1" value={q} onChange={e=>setQ(e.target.value)}
                    placeholder="예) 제주, 교토 기온, 파리 에펠탑" autoComplete="off" />
                )}

                {!city && q.trim() && (
                  <div className="absolute z-10 left-0 right-0 mt-1 bg-white rounded-xl shadow-xl border border-[#e7eaf3] overflow-hidden">
                    {searching && <div className="px-3 py-2 text-xs text-[#9aa2b5]">검색 중…</div>}
                    {!searching && results.length === 0 &&
                      <div className="px-3 py-2 text-xs text-[#9aa2b5]">결과 없음 — 그대로 두면 클릭한 지점에 표시됩니다</div>}
                    {results.map(r => (
                      <button key={r.osm_id} type="button" onClick={()=>{ setCity(r); setResults([]); }}
                        className="w-full text-left px-3 py-2 hover:bg-[#f7f2ea] border-b border-[#f5efe6] last:border-0">
                        <div className="text-sm text-[#101527] flex items-center gap-1.5">
                          {r.name}
                          {r.cached && <span className="text-[9px] bg-[#4F46E5]/10 text-[#4F46E5] px-1.5 py-0.5 rounded">DB</span>}
                        </div>
                        <div className="text-[11px] text-[#5b6478] truncate">{r.display}</div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <div>
                <label className="text-xs font-semibold text-[#5b6478]">방문일</label>
                <input className="inp mt-1" type="date" value={date} onChange={e=>setDate(e.target.value)} />
              </div>
              <div>
                <label className="text-xs font-semibold text-[#5b6478]">여행 그룹 <span className="font-normal text-[#9aa2b5]">— 한 여행의 도시들을 묶어요</span></label>
                <select className="inp mt-1" value={tripSel} onChange={e=>setTripSel(e.target.value)}>
                  <option value="">여행 없음</option>

              <div className="pt-1 border-t border-[#e7eaf3]">

    // ─────────────────────────── 다이어리 수정/추가 모달 ───────────────────────────
    // 방문지 추가 때 다이어리를 건너뛰었어도 나중에 쓰거나 고칠 수 있게
    function EditModal({ place, trips, onClose, onSaved }) {

      const [body, setBody] = useState(entry?.body || "");
      const [date, setDate] = useState(place.visited_at || "");

      const [insta, setInsta] = useState(entry?.insta_url || "");
      const [file, setFile] = useState(null);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState("");

      const save = async (e) => {
        e.preventDefault(); setBusy(true); setErr("");
        try {
          // 여행 그룹: 새 여행이면 먼저 생성
          let trip_id = tripSel && tripSel !== "__new" ? tripSel : null;
          if (tripSel === "__new") {
            if (!newTrip.trim()) throw new Error("새 여행의 이름을 입력해주세요.");
            const { data: trip, error: eT } = await sb.from("tm_trips").insert({
              title: newTrip.trim(), color: TRIP_COLORS[trips.length % TRIP_COLORS.length],
              started_at: date || null,
            }).select().single();
            if (eT) throw eT;
            trip_id = trip.id;
          }
          // 방문일·여행 변경 → 경로/정렬/그룹에 반영
          const { error: e0 } = await sb.from("tm_places")
            .update({ visited_at: date || null, trip_id }).eq("id", place.id);
          if (e0) throw e0;

          if (entry || title.trim() || body.trim() || file) {
            let photo_url = entry?.photo_url || null;
            if (file) {
              const { data:{ user } } = await sb.auth.getUser();
              const path = `${user.id}/${place.id}-${file.name.replace(/[^\w.]/g,"_")}`;
              const { error: e1 } = await sb.storage.from("trip-photos").upload(path, file, { upsert:true });
              if (e1) throw e1;
              // 같은 경로에 덮어써도 새 사진이 보이도록 캐시버스터, 이전 파일은 정리
              photo_url = sb.storage.from("trip-photos").getPublicUrl(path).data.publicUrl + `?v=${Date.now()}`;
              const old = entry?.photo_url?.split("/trip-photos/")[1]?.split("?")[0];
              if (old && decodeURIComponent(old) !== path)
                sb.storage.from("trip-photos").remove([decodeURIComponent(old)]);
            }
            const row = { title: title.trim() || place.city, body, photo_url, insta_url: insta.trim() || null };
            const { error: e2 } = entry
              ? await sb.from("tm_diary_entries").update(row).eq("id", entry.id)
              : await sb.from("tm_diary_entries").insert({ place_id: place.id, ...row });
            if (e2) throw e2;
          }
          onSaved();
        } catch (ex) { setErr(ex.message || "저장 실패"); setBusy(false); }
      };

      return (
        <div className="fixed inset-0 z-[1000] bg-black/50 flex items-center justify-center px-4" onClick={onClose}>
          <form onClick={e=>e.stopPropagation()} onSubmit={save}
            className="fade-in bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
            <div className="px-5 py-4 bg-gradient-to-br from-[#4F46E5] to-[#6D28D9] text-white">

              <div className="display font-bold text-lg mt-1">{place.city}</div>
              <div className="text-xs opacity-80">{place.country_ko || place.country} · 다이어리 {entry ? "수정" : "쓰기"}</div>

            <div className="p-5 space-y-3">

              </div>
              <div>
                <label className="text-xs font-semibold text-[#5b6478]">여행 그룹</label>
                <select className="inp mt-1" value={tripSel} onChange={e=>setTripSel(e.target.value)}>
                  <option value="">여행 없음</option>
                  {trips.map(t => <option key={t.id} value={t.id}>🧳 {t.title}</option>)}
                  <option value="__new">➕ 새 여행 만들기</option>
                </select>
                {tripSel === "__new" &&
                  <input className="inp mt-2" value={newTrip} onChange={e=>setNewTrip(e.target.value)}
                    placeholder='여행 이름 — 예) "2026 유럽 여행"' autoFocus />}
              </div>
              <div>
                <label className="text-xs font-semibold text-[#5b6478]">제목</label>
                <input className="inp mt-1" value={title} onChange={e=>setTitle(e.target.value)} placeholder="제목" />
              </div>
              <div>
                <label className="text-xs font-semibold text-[#5b6478]">내용</label>
                <textarea className="inp mt-1" rows="4" value={body} onChange={e=>setBody(e.target.value)} placeholder="그날의 기억을 남겨보세요" />

    // ── 구글 평점 (Edge Function 프록시 · 결과는 tm_ratings에 캐시) ──
    //    rating은 Places API Enterprise SKU($20/1,000회, 무료 월 1,000회)라
    //    방문지당 1회만 호출하고 이후에는 캐시를 쓴다.
    function GoogleRating({ place, canFetch }) {
      const [data, setData] = useState(undefined);   // undefined=로딩전, null=없음
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState("");

      useEffect(() => {
        let alive = true;
        setErr(""); setData(undefined);
        sb.from("tm_ratings").select("*").eq("place_id", place.id).maybeSingle()
          .then(({ data }) => { if (alive) setData(data || null); });
        return () => { alive = false; };
      }, [place.id]);

      const fetchRating = async () => {
        setBusy(true); setErr("");
        try {
          const q = `${place.city} ${place.country_ko || place.country}`;
          const { data: res, error } = await sb.functions.invoke("places-rating", {
            body: { query: q, lat: place.lat, lng: place.lng },
          });
          if (error) {
            // Edge Function이 비정상 코드를 주면 본문을 읽어 사유를 구분
            let reason = "";
            try { reason = (await error.context?.json())?.error || ""; } catch {}
            throw new Error(reason === "NO_KEY"
              ? "아직 구글 API 키가 연결되지 않았어요. (키만 넣으면 바로 동작합니다)"
              : reason === "NOT_FOUND" ? "구글에서 이 장소를 찾지 못했어요."
              : "평점을 불러오지 못했어요.");
          }
          const row = {
            place_id: place.id, google_place_id: res.googlePlaceId, name: res.name,
            rating: res.rating, user_rating_count: res.userRatingCount,
          };
          await sb.from("tm_ratings").upsert(row, { onConflict: "place_id" });
          setData(row);
        } catch (ex) { setErr(ex.message); }
        setBusy(false);
      };

      if (data) {
        return (
          <div className="mt-3 flex items-center gap-2 bg-[#f6f8fd] border border-[#e7eaf3] rounded-xl px-3 py-2">
            <span className="text-[15px]">⭐</span>
            <span className="display font-bold text-[15px] text-[#101527]">{Number(data.rating).toFixed(1)}</span>
            <span className="mono-tag text-[10px] text-[#8b93a7]">
              {data.user_rating_count?.toLocaleString()} reviews
            </span>
            <span className="ml-auto mono-tag text-[9px] text-[#b6bdcd] uppercase">Google</span>
          </div>
        );
      }
      if (!canFetch) return null;
      return (
        <div className="mt-3">
          <button onClick={fetchRating} disabled={busy}
            className="w-full rounded-xl py-2 text-[12.5px] font-semibold bg-white text-[#5b6478] border border-[#e0e5f0] hover:bg-[#f4f6fb] transition disabled:opacity-50">
            {busy ? "불러오는 중…" : "⭐ 구글 평점 불러오기"}
          </button>
          {err && <div className="text-[11.5px] text-[#e11d48] mt-1.5 leading-relaxed">{err}</div>}
        </div>
      );
    }

    // ── 경로 패널: Travel Log처럼 여행 그룹별 섹션 · 그룹 안에서 드래그로 순서 편집 ──
    function RoutePanel({ groups, canEdit, onReorder, onPick }) {
      const [drag, setDrag] = useState(null);   // {g, i}
      const [over, setOver] = useState(null);   // {g, i}

      // 그룹 순서를 유지한 채 평탄화 → 전역 route_order 저장
      const commit = (nextGroups) => onReorder(nextGroups.flatMap(g => g.items));

      const drop = (g, i) => {
        if (!drag || drag.g !== g || drag.i === i) { setDrag(null); setOver(null); return; }
        const next = groups.map(x => ({ ...x, items:[...x.items] }));
        const [moved] = next[g].items.splice(drag.i, 1);
        next[g].items.splice(i, 0, moved);
        setDrag(null); setOver(null);
        commit(next);
      };
      const move = (g, i, dir) => {             // 모바일·키보드용 ↑↓ (그룹 안에서만)
        const to = i + dir;
        if (to < 0 || to >= groups[g].items.length) return;
        const next = groups.map(x => ({ ...x, items:[...x.items] }));
        [next[g].items[i], next[g].items[to]] = [next[g].items[to], next[g].items[i]];
        commit(next);
      };

      const total = groups.reduce((s,g)=>s+g.items.length, 0);
      return (
        <div className="glass-strong rounded-2xl shadow-lg w-[210px] md:w-[240px] overflow-hidden">
          <div className="px-3.5 pt-3 pb-2 flex items-center gap-1.5">
            <span className="mono-tag text-[10px] font-semibold text-[#8b93a7] uppercase tracking-widest">Route</span>
            <span className="mono-tag text-[10px] text-[#b6bdcd]">{total}</span>
            {canEdit && <span className="ml-auto text-[9.5px] text-[#b6bdcd]">그룹 안에서 드래그</span>}
          </div>
          <div className="max-h-[30vh] md:max-h-[46vh] overflow-y-auto card-scroll pb-2">
            {groups.map((grp, g) => (
              <div key={grp.key}>
                {/* 여행 섹션 헤더 */}
                <div className="flex items-center gap-1.5 px-3 pt-2 pb-1">
                  <span className="inline-block w-2 h-2 rounded-full flex-shrink-0" style={{background:grp.color}}></span>
                  <span className="text-[10.5px] font-bold text-[#5b6478] truncate">{grp.title}</span>
                  <div className="flex-1 h-px bg-[#eef0f7]" />
                </div>
                {grp.items.map((p, i) => (
                  <div key={p.id}
                    draggable={canEdit}
                    onDragStart={() => setDrag({g, i})}
                    onDragOver={e => { e.preventDefault(); setOver({g, i}); }}
                    onDragLeave={() => setOver(o => o && o.g===g && o.i===i ? null : o)}
                    onDrop={() => drop(g, i)}
                    onDragEnd={() => { setDrag(null); setOver(null); }}
                    className={`rstop group flex items-center gap-2 px-3 py-1.5 ${canEdit ? "cursor-grab active:cursor-grabbing" : ""} hover:bg-[#f4f6fb]
                      ${drag && drag.g===g && drag.i===i ? "dragging" : ""}
                      ${over && over.g===g && over.i===i && drag && drag.g===g && drag.i!==i ? "dragover" : ""}`}>
                    <span className="rnum flex-shrink-0" style={{position:"static", background:grp.color}}>{i+1}</span>
                    <button onClick={() => onPick(p.id)} className="flex-1 min-w-0 text-left">
                      <div className="text-[12.5px] font-semibold text-[#101527] truncate">{p.flag} {p.city}</div>
                      {p.visited_at && <div className="mono-tag text-[9px] text-[#9aa2b5]">{p.visited_at}</div>}
                    </button>
                    {canEdit && (
                      <span className="flex md:hidden md:group-hover:flex flex-col flex-shrink-0">
                        <button onClick={() => move(g, i,-1)} className="text-[9px] leading-[9px] text-[#9aa2b5] hover:text-[#4F46E5]">▲</button>
                        <button onClick={() => move(g, i, 1)} className="text-[9px] leading-[9px] text-[#9aa2b5] hover:text-[#4F46E5]">▼</button>
                      </span>
                    )}
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────── 공유 패널 ───────────────────────────

                  : shares.members.map(m => (
                      <div key={m.share_id} className="flex items-center gap-2 py-1.5">
                        <span className="w-7 h-7 rounded-full bg-[#eef0f7] flex items-center justify-center text-[11px] font-semibold text-[#5b6478]">

    // ─────────────────────────── 메인 앱 ───────────────────────────
    function MapApp({ session }) {
      const mapRef = useRef(null), tileRef = useRef(null), geoRef = useRef(null), markersRef = useRef({});
      const modeRef = useRef("scratch"), addRef = useRef(false), visitedRef = useRef(new Map());
      const routeRef = useRef(null);
      const geoDataRef = useRef(null);                 // 스크린샷 렌더용 (태평양 좌표계 GeoJSON)
      const myId = session.user.id;

      const [allPlaces, setAllPlaces] = useState([]);   // 내 것 + 공유받은 것 (RLS가 걸러줌)
      const [allTrips, setAllTrips] = useState([]);     // 여행 그룹 (내 것 + 공유받은 것)
      const [shares, setShares] = useState({ members:[], owners:[] });
      const [scope, setScope] = useState("mine");        // mine | all | <ownerId>
      const [selected, setSelected] = useState(null);
      const [mode, setMode] = useState("scratch");
      const [addMode, setAddMode] = useState(false);
      const [showRoute, setShowRoute] = useState(false);
      const [sharePanel, setSharePanel] = useState(false);
      const [pending, setPending] = useState(null);
      const [editing, setEditing] = useState(null);      // 다이어리 수정 대상 place
      const [loading, setLoading] = useState(true);
      const [loadErr, setLoadErr] = useState(false);
      const [geoErr, setGeoErr] = useState(false);

      // ── 데이터 로드 ──
      const load = useCallback(async () => {
        const { data, error } = await sb.from("tm_places")
          .select("*, tm_diary_entries(*)")
          .order("visited_at", { ascending:false, nullsFirst:false })
          .order("created_at", { referencedTable:"tm_diary_entries", ascending:false }); // 다이어리 여러 건이면 최신을 대표로
        if (error) setLoadErr(true);
        else { setAllPlaces(data || []); setLoadErr(false); }
        const { data: trips } = await sb.from("tm_trips").select("*")
          .order("started_at", { ascending:false, nullsFirst:false });
        setAllTrips(trips || []);
        const { data: sh } = await sb.rpc("tm_share_list");
        setShares({
          members: (sh || []).filter(r => r.kind === "member"),
          owners:  (sh || []).filter(r => r.kind === "owner"),
        });
        setLoading(false);
      }, []);
      useEffect(() => { load(); }, [load]);

      // 현재 보고 있는 지도 범위
      const places = useMemo(() => {
        if (scope === "mine") return allPlaces.filter(p => p.user_id === myId);
        if (scope === "all")  return allPlaces;
        return allPlaces.filter(p => p.user_id === scope);
      }, [allPlaces, scope, myId]);

      const readOnly = scope !== "mine";   // 남의 지도/함께보기에선 추가 불가
      const myTrips = useMemo(() => allTrips.filter(t => t.user_id === myId), [allTrips, myId]);
      const tripById = useMemo(() => new Map(allTrips.map(t => [t.id, t])), [allTrips]);
      const tripColor = (id) => tripById.get(id)?.color || "#4F46E5";

      // 사이드바용: 여행별 섹션 (여행 없는 방문지는 '미분류')
      // 방문지 0개인 내 여행도 섹션으로 노출 — 안 보이면 유령이 되고 관리도 불가능해짐
      const tripGroups = useMemo(() => {
        const byTrip = new Map();
        places.forEach(p => {
          const key = p.trip_id && tripById.has(p.trip_id) ? p.trip_id : "none";
          if (!byTrip.has(key)) byTrip.set(key, []);
          byTrip.get(key).push(p);
        });
        const groups = allTrips
          .filter(t => byTrip.has(t.id) || (scope === "mine" && t.user_id === myId))
          .map(t => ({ trip:t, items:byTrip.get(t.id) || [] }));
        if (byTrip.has("none")) groups.push({ trip:null, items:byTrip.get("none") });
        return groups;
      }, [places, allTrips, tripById, scope, myId]);
      const hasTrips = tripGroups.some(g => g.trip);   // 여행이 하나도 없으면 헤더 없이 기존 플랫 뷰

      // 여행 이름 변경 / 삭제 (삭제 시 방문지는 미분류로 — FK on delete set null)
      const renameTrip = async (t) => {
        const name = prompt("여행 이름 변경", t.title);
        if (!name?.trim() || name.trim() === t.title) return;
        await sb.from("tm_trips").update({ title: name.trim() }).eq("id", t.id);
        load();
      };
      const deleteTrip = async (t) => {
        if (!confirm(`'${t.title}' 여행을 삭제할까요?\n방문지·다이어리는 남고 '미분류'로 이동합니다.`)) return;
        await sb.from("tm_trips").delete().eq("id", t.id);
        load();
      };

      // 공유가 회수되면 사라진 지도에 갇히지 않도록 scope 복구
      useEffect(() => {
        if (scope === "mine") return;
        if (shares.owners.length === 0 || (scope !== "all" && !shares.owners.some(o => o.other_id === scope))) {
          setScope("mine"); setSelected(null);
        }
      }, [shares.owners, scope]);
      const ownerEmail = (uid) => uid === myId ? null
        : (shares.owners.find(o => o.other_id === uid)?.other_email || "공유된 기록");

      // 방문국 Map: country(영문 GeoJSON명) → 대륙 (색칠 매칭용)
      // + 함께 보기용 소유자 Map: country → mine | theirs | both
      const ownershipRef = useRef(new Map());
      const scopeRef = useRef("mine");
      useEffect(() => {
        scopeRef.current = scope;
        const m = new Map(), own = new Map();
        places.forEach(p => {
          m.set(p.country, p.continent || "기타");
          const who = p.user_id === myId ? "mine" : "theirs";
          const cur = own.get(p.country);
          own.set(p.country, cur && cur !== who ? "both" : (cur || who));
        });
        visitedRef.current = m;
        ownershipRef.current = own;
      }, [places, scope, myId]);

      // 대륙별 진행률 (국가 수 기준 — UN 기준 대륙별 국가 수)
      const CONT_TOTALS = { "아시아":48, "유럽":44, "아프리카":54, "북미":23, "남미":12, "오세아니아":14 };
      const stats = useMemo(() => {
        const countries = new Set(places.map(p => p.country));
        const byCont = {};
        places.forEach(p => {
          const c = p.continent;
          if (!c || c === "기타") return;
          (byCont[c] = byCont[c] || new Set()).add(p.country);
        });
        const perCont = Object.entries(CONT_TOTALS).map(([name, total]) => ({
          name, total, n: byCont[name]?.size || 0,
          pct: Math.round(((byCont[name]?.size || 0) / total) * 100),
        }));
        return { countries:countries.size, cities:places.length,
                 world: Math.round((countries.size/195)*100), perCont };
      }, [places]);

      // 스타일 정의
      // 함께 보기(scope=all)에서는 대륙색 대신 소유자색: 나=인디고 / 상대=코랄 / 같이=사선 스트라이프
      const OWN_FILL = { mine:"#4F46E5", theirs:"#FB7185", both:"#4F46E5" };  // both는 아래에서 패턴으로 덮음
      const styleFor = (feature, m) => {
        const name = feature.properties.name;
        const on = visitedRef.current.has(name);
        const together = scopeRef.current === "all";
        if (m === "scratch") {
          if (!on) return { fillColor:"#D6DBEA", fillOpacity:.94, color:"#140F2E", weight:.6, opacity:.45, dashArray:null };
          const fill = together
            ? OWN_FILL[ownershipRef.current.get(name)] || "#4F46E5"
            : REVEAL[visitedRef.current.get(name)] || "#60A5FA";
          return { fillColor:fill, fillOpacity:.92, color:"#fff", weight:1.2, opacity:.95, dashArray:null };
        }
        if (!on) return { fillColor:"#000", fillOpacity:0, color:"#000", weight:0, opacity:0, dashArray:null };
        const fill = together ? (OWN_FILL[ownershipRef.current.get(name)] || "#4F46E5") : "#4F46E5";
        return { fillColor:fill, fillOpacity:.45, color:fill, weight:1.5, opacity:.9, dashArray:"3" };
      };
      // '같이 간 나라'는 setStyle 이후 SVG fill을 스트라이프 패턴으로 교체
      const paintDual = (layer) => {
        if (scopeRef.current !== "all") return;
        if (ownershipRef.current.get(layer.feature?.properties?.name) !== "both") return;
        layer.getElement()?.setAttribute("fill", "url(#dualStripe)");
      };
      // hover: 대륙 컬러(민트 등)와 겹치지 않게 화이트/잉크 톤으로 분리
      const hoverStyle = m => m === "scratch"
        ? { fillColor:"#ffffff", fillOpacity:.92, color:"#4F46E5", weight:2.5, opacity:1, dashArray:null }
        : { fillColor:"#101527", fillOpacity:.35, color:"#101527", weight:2.5, opacity:1, dashArray:null };

      // ── 국경 GeoJSON 로드 (실패 시 재시도 가능) ──
      const loadGeo = useCallback(() => {
        setGeoErr(false);
        fetch(GEO_URL).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(geo => {
          const map = mapRef.current; if (!map || geoRef.current) return;   // 언마운트/중복 가드
          geoDataRef.current = pacifyGeo(geo);
          geoRef.current = L.geoJSON(geoDataRef.current, {
            style: f => styleFor(f, modeRef.current),
            onEachFeature: (f, layer) => {
              layer.bindTooltip(f.properties.name, { permanent:false, direction:"center", className:"ctry-label", opacity:1 });
              // 국가명 위치 보정: 멀티폴리곤(러시아·중국 등)은 Leaflet 기본 중심이
              // 구석으로 밀림 → 가장 큰 본토 조각의 bbox 중심에 라벨을 앉힌다.
              // 날짜변경선(±180°)을 걸치는 나라는 경도를 +360 정규화 후 계산.
              const ll = countryLabelPoint(f);
              if (ll) layer.on("tooltipopen", ev => ev.tooltip.setLatLng(ll));
              layer.on("mouseover", () => {
                layer.setStyle(hoverStyle(modeRef.current));
                layer.bringToFront();
                layer.getElement()?.classList.add("ctry-hover");
                layer.openTooltip();
              });
              layer.on("mouseout", () => {
                layer.getElement()?.classList.remove("ctry-hover");
                layer.setStyle(styleFor(f, modeRef.current));
                paintDual(layer);                            // 같이 간 나라면 스트라이프 복구
                const keep = modeRef.current === "scratch" && visitedRef.current.has(f.properties.name);
                if (!keep) layer.closeTooltip();
              });
              layer.on("click", (e) => {
                if (addRef.current) {                       // 추가 모드: 그 나라에 방문지 새기기
                  setPending({ country:f.properties.name, iso3:f.id, lat:e.latlng.lat, lng:normLng(e.latlng.lng) });
                  setAddMode(false);
                }
              });
            },
          }).addTo(map);
          // 함께 보기 '같이 간 나라'용 사선 스트라이프 패턴 (인디고/코랄 교차)
          const svg = map.getPane("overlayPane").querySelector("svg");
          if (svg && !svg.querySelector("#dualStripe")) {
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            defs.innerHTML = '<pattern id="dualStripe" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'
              + '<rect width="14" height="14" fill="#4F46E5"/><rect width="7" height="14" fill="#FB7185"/></pattern>';
            svg.appendChild(defs);
          }
          applyMode();                                       // 첫 스타일/라벨 적용
        }).catch(() => setGeoErr(true));                     // 네트워크 실패 → 재시도 UI
      }, []);

      // ── 지도 1회 초기화 (언마운트 시 리스너·인스턴스 정리) ──
      useEffect(() => {
        // 초기 뷰: 대한민국 중심 (아시아·태평양이 정면에 오도록)
        // zoomSnap 기본값(1)이면 줌이 정수로 스냅돼 세계지도가 화면보다 작아지고
        // maxBounds에 걸려 중심이 서쪽으로 밀림 → 소수 줌 허용 + 화면 폭에 맞는 줌 계산
        const map = L.map("map", { worldCopyJump:false, minZoom:2, zoomSnap:0.25, zoomDelta:0.5,
          maxBounds:[[-85,-150],[85,450]] }).setView([32,127], 2.4);
        mapRef.current = map;
        tileRef.current = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          { attribution:'© OpenStreetMap', maxZoom:18 }).addTo(map);
        const onResize = () => map.invalidateSize();
        // 레이아웃 확정 후 크기 재계산 + 화면 폭을 채우는 줌으로 대한민국 재센터링
        setTimeout(() => {
          map.invalidateSize();
          const w = document.getElementById("map")?.clientWidth || 1024;
          const fitZoom = Math.max(2.2, Math.log2(w / 256));   // 세계지도가 가로를 채우는 줌
          map.setView([32,127], Math.round(fitZoom * 4) / 4, { animate:false });
        }, 250);
        window.addEventListener("resize", onResize);
        loadGeo();
        return () => {                                       // 로그아웃 후 재로그인 시 누수 방지
          window.removeEventListener("resize", onResize);
          map.remove();
          mapRef.current = geoRef.current = tileRef.current = routeRef.current = null;
          markersRef.current = {};
        };
      }, []);

      // ── 모드/데이터 변경 시 스타일·라벨 재적용 ──
      const applyMode = useCallback(() => {
        const el = document.getElementById("map"); if (!el) return;
        el.classList.toggle("scratch", modeRef.current === "scratch");
        el.classList.toggle("real", modeRef.current === "real");
        if (tileRef.current) tileRef.current.setOpacity(modeRef.current === "real" ? 1 : 0);
        if (!geoRef.current) return;
        geoRef.current.eachLayer(layer => {
          const f = layer.feature;
          layer.setStyle(styleFor(f, modeRef.current));
          paintDual(layer);                                  // 함께 보기: 같이 간 나라 스트라이프
          const show = modeRef.current === "scratch" && visitedRef.current.has(f.properties.name);
          const tip = layer.getTooltip();
          if (tip) { tip.options.permanent = show; show ? layer.openTooltip() : layer.closeTooltip(); }
        });
      }, []);

      useEffect(() => { modeRef.current = mode; applyMode(); }, [mode, applyMode]);
      useEffect(() => { applyMode(); }, [places, applyMode]);

      // 저장 직후 해당 국가에 '긁기' 리빌 애니메이션 (색칠 반영 후 1회)
      const revealRef = useRef(null);
      useEffect(() => {
        if (!revealRef.current || !geoRef.current) return;
        const target = revealRef.current; revealRef.current = null;
        geoRef.current.eachLayer(layer => {
          if (layer.feature?.properties?.name !== target) return;
          const el = layer.getElement(); if (!el) return;
          el.classList.remove("ctry-scratched");
          void el.getBoundingClientRect();          // 리플로우로 애니메이션 재시작 보장
          el.classList.add("ctry-scratched");
          setTimeout(() => el.classList.remove("ctry-scratched"), 1300);
        });
      }, [places]);
      useEffect(() => { addRef.current = addMode;
        document.getElementById("map")?.classList.toggle("adding", addMode); }, [addMode]);

      // 남의 지도를 볼 땐 추가 모드 해제
      useEffect(() => { if (readOnly) setAddMode(false); }, [readOnly]);

      // ── 체크인 경로 ──
      // 순서: route_order(수동) 우선 → 없으면 방문일 → 그다음 등록일. 모든 방문지 포함.
      const routeStops = useMemo(() => [...places].sort((a, b) => {
        const ra = a.route_order ?? Infinity, rb = b.route_order ?? Infinity;
        if (ra !== rb) return ra - rb;
        const va = a.visited_at || "9999", vb = b.visited_at || "9999";
        if (va !== vb) return va.localeCompare(vb);
        return (a.created_at || "").localeCompare(b.created_at || "");
      }), [places]);

      useEffect(() => {
        const map = mapRef.current; if (!map) return;
        if (routeRef.current) { map.removeLayer(routeRef.current); routeRef.current = null; }
        if (!showRoute || routeStops.length < 2) return;

        // 여행별로 경로를 분리 — 여행마다 자기 색, 순번도 여행 안에서 1부터
        const byTrip = new Map();
        routeStops.forEach(p => {
          const key = p.trip_id && tripById.has(p.trip_id) ? p.trip_id : "none";
          if (!byTrip.has(key)) byTrip.set(key, []);
          byTrip.get(key).push(p);
        });

        const layers = [];
        byTrip.forEach((stops, key) => {
          const color = key === "none" ? "#8b93a7" : tripColor(key);   // 미분류는 회색
          const pts = stops.map(p => [p.lat, dispLng(p.lng)]);
          if (pts.length >= 2) {
            const poly = L.polyline(pts, { color, weight:2.5, opacity:.95, dashArray:"7 7", lineCap:"round" });
            layers.push(poly);
          }
          pts.forEach((ll, i) => layers.push(L.marker(ll, {
            interactive:false,
            icon: L.divIcon({ className:"",
              html:`<div class="rnum" style="background:${color}">${i+1}</div>`,
              iconSize:[18,18], iconAnchor:[9,30] }),
          })));
        });
        routeRef.current = L.layerGroup(layers).addTo(map);
      }, [showRoute, routeStops, tripById]);

      // 경로 패널용: Travel Log와 같은 여행 그룹 구조 (지도 순번·색과 일치)
      const routeGroups = useMemo(() => {
        const byTrip = new Map();
        routeStops.forEach(p => {
          const key = p.trip_id && tripById.has(p.trip_id) ? p.trip_id : "none";
          if (!byTrip.has(key)) byTrip.set(key, []);
          byTrip.get(key).push(p);
        });
        const gs = allTrips.filter(t => byTrip.has(t.id)).map(t => ({
          key:t.id, title:`🧳 ${t.title}`, color:t.color || "#4F46E5", items:byTrip.get(t.id) }));
        if (byTrip.has("none")) gs.push({ key:"none", title:"미분류", color:"#8b93a7", items:byTrip.get("none") });
        return gs;
      }, [routeStops, allTrips, tripById]);

      // ── 📸 내 지도 스크린샷: 스크래치 맵 전체를 캔버스로 그려 PNG 다운로드 ──
      // (화면 캡처 대신 직접 렌더 — 줌 상태 무관하게 항상 전체 지도 + 타일 CORS 문제 없음)
      const exportMap = () => {
        const geo = geoDataRef.current; if (!geo) return;
        const W = 1600, H = 1000, TOP = 130, BOT = 44, SIDE = 44;
        const c = document.createElement("canvas"); c.width = W; c.height = H;
        const x = c.getContext("2d");

        x.fillStyle = "#140F2E"; x.fillRect(0, 0, W, H);

        // 웹 메르카토르 투영 (위도 -56~76 크롭)
        const merc = lat => Math.log(Math.tan(Math.PI/4 + Math.max(-85, Math.min(85, lat)) * Math.PI/360));
        const yT = merc(76), yB = merc(-56), MH = H - TOP - BOT, MW = W - SIDE*2;
        const px = lng => SIDE + (lng + 30) / 360 * MW;          // 태평양 좌표계: -30 ~ 330
        const py = lat => TOP + (yT - merc(lat)) / (yT - yB) * MH;

        // 국가 폴리곤 (외곽 링만)
        geo.features.forEach(f => {
          const name = f.properties.name;
          const on = visitedRef.current.has(name);
          const g = f.geometry;
          x.beginPath();
          (g.type === "Polygon" ? [g.coordinates] : g.coordinates).forEach(rings => {
            rings[0].forEach(([lo, la], i) => i ? x.lineTo(px(lo), py(la)) : x.moveTo(px(lo), py(la)));
            x.closePath();
          });
          x.fillStyle = on ? (REVEAL[visitedRef.current.get(name)] || "#60A5FA") : "#D6DBEA";
          x.globalAlpha = on ? .92 : .85; x.fill(); x.globalAlpha = 1;
          x.strokeStyle = on ? "#ffffff" : "#140F2E"; x.lineWidth = on ? 1.3 : .5; x.stroke();
        });

        // 여행 경로 (여행별 색·점선)
        routeGroups.forEach(grp => {
          if (grp.items.length < 2) return;
          x.strokeStyle = grp.color; x.lineWidth = 2.5; x.setLineDash([9, 9]); x.lineCap = "round"; x.globalAlpha = .95;
          x.beginPath();
          grp.items.forEach((p, i) => {
            const X = px(dispLng(p.lng)), Y = py(p.lat);
            i ? x.lineTo(X, Y) : x.moveTo(X, Y);
          });
          x.stroke(); x.setLineDash([]); x.globalAlpha = 1;
        });

        // 방문지 핀 (점 + 국기)
        places.forEach(p => {
          const X = px(dispLng(p.lng)), Y = py(p.lat);
          x.beginPath(); x.arc(X, Y, 7, 0, 7);
          x.fillStyle = REVEAL[p.continent] || "#60A5FA"; x.fill();
          x.lineWidth = 2.5; x.strokeStyle = "#fff"; x.stroke();
          x.font = "16px sans-serif"; x.textAlign = "center"; x.textBaseline = "bottom";
          x.fillText(p.flag || "🌍", X, Y - 9);
        });

        // 헤더 (로고 + 통계) / 푸터
        const bg = x.createLinearGradient(SIDE, 36, SIDE + 56, 92);
        bg.addColorStop(0, "#5EEAD4"); bg.addColorStop(.4, "#38BDF8"); bg.addColorStop(.75, "#4F46E5"); bg.addColorStop(1, "#6D28D9");
        x.fillStyle = bg; x.beginPath(); x.roundRect(SIDE, 34, 56, 56, 15); x.fill();
        x.font = "30px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("🧭", SIDE + 28, 64);
        x.textAlign = "left"; x.textBaseline = "alphabetic";
        x.fillStyle = "#fff"; x.font = "800 40px Outfit, sans-serif"; x.fillText("Trailmark", SIDE + 72, 78);
        const titleW = x.measureText("Trailmark").width;
        x.fillStyle = "rgba(255,255,255,.75)"; x.font = "500 19px Pretendard, sans-serif";
        x.fillText(`${stats.countries}개국 · ${stats.cities}개 도시의 기억`, SIDE + 72 + titleW + 26, 76);
        x.textAlign = "right";
        x.fillStyle = "rgba(255,255,255,.45)"; x.font = "600 15px Outfit, sans-serif";
        x.fillText(`trailmark.co.kr · ${new Date().toISOString().slice(0,10)}`, W - SIDE, 76);
        x.textAlign = "left";

        c.toBlob(blob => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `trailmark-${new Date().toISOString().slice(0,10)}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        }, "image/png");
      };

      // 드래그 재정렬 → route_order 저장 (낙관적 갱신)
      const saveRouteOrder = async (ordered) => {
        setAllPlaces(prev => prev.map(p => {
          const idx = ordered.findIndex(o => o.id === p.id);
          return idx >= 0 ? { ...p, route_order: idx } : p;
        }));
        await Promise.all(ordered.map((p, i) =>
          sb.from("tm_places").update({ route_order: i }).eq("id", p.id)));
      };

      // ── 방문지 핀 동기화 ──
      useEffect(() => {
        const map = mapRef.current; if (!map) return;
        Object.values(markersRef.current).forEach(mk => map.removeLayer(mk));
        markersRef.current = {};
        places.forEach(p => {
          const c1 = REVEAL[p.continent] || "#818CF8", c2 = DEEP[p.continent] || "#4F46E5";
          const icon = L.divIcon({ className:"",
            html:`<div class="pin" style="--c:${c1};--c2:${c2}"><span>${esc(p.flag||"🌍")}</span></div>`,
            iconSize:[34,34], iconAnchor:[17,34] });
          const mk = L.marker([p.lat, dispLng(p.lng)], { icon }).addTo(map);
          mk.bindPopup(`<b>${esc(p.country_ko||p.country)} · ${esc(p.city)}</b>`);
          mk.on("click", () => setSelected(p.id));
          markersRef.current[p.id] = mk;
        });
      }, [places]);

      // ── 선택 → 이동 + 핀 강조 ──
      const flownRef = useRef(null);                     // 같은 선택으로 재비행 방지 (load 후 places 갱신 시)
      useEffect(() => {
        Object.entries(markersRef.current).forEach(([id, mk]) => {
          const el = mk.getElement()?.querySelector(".pin");
          if (el) el.classList.toggle("active", id === selected);
        });
        if (!selected) { flownRef.current = null; return; }
        const p = places.find(x => x.id === selected);
        if (p && mapRef.current && flownRef.current !== selected) {
          flownRef.current = selected;
          mapRef.current.flyTo([p.lat, dispLng(p.lng)], 5, { duration:1 }); markersRef.current[p.id]?.openPopup();
        }
      }, [selected, places]);

      const remove = async (id) => {
        if (!confirm("이 방문지와 다이어리를 삭제할까요?")) return;
        // 사진은 DB CASCADE로 안 지워지므로 Storage에서 직접 정리 (고아 파일 방지)
        const p = places.find(x => x.id === id);
        const paths = (p?.tm_diary_entries || [])
          .map(en => en.photo_url?.split("/trip-photos/")[1]?.split("?")[0])
          .filter(Boolean).map(decodeURIComponent);
        const { error } = await sb.from("tm_places").delete().eq("id", id);
        if (error) { alert("삭제하지 못했어요: " + error.message); return; }
        if (paths.length) sb.storage.from("trip-photos").remove(paths);
        if (selected === id) setSelected(null);
        load();
      };

      const selPlace = places.find(p => p.id === selected);
      const selEntry = selPlace?.tm_diary_entries?.[0];

      return (
        <div className="h-screen w-screen flex flex-col-reverse md:flex-row overflow-hidden">
          <aside className="panel w-full md:w-[390px] flex-shrink-0 h-[45vh] md:h-full flex flex-col overflow-y-auto md:overflow-hidden border-t md:border-t-0 md:border-r border-[#e7eaf3]">
            {/* 헤더 — 로고 배지에만 그라데이션 */}
            <div className="px-5 pt-5 pb-3">
              <div className="flex items-center gap-2.5">
                <span className="aurora w-9 h-9 rounded-xl flex items-center justify-center text-[18px] shadow-sm">🧭</span>
                <div className="leading-tight">
                  <h1 className="display text-[20px] font-extrabold text-[#101527]">Trailmark</h1>
                  <div className="mono-tag text-[9px] text-[#9aa2b5] uppercase">Travel Passport</div>
                </div>
                <button onClick={()=>sb.auth.signOut()}
                  className="ml-auto mono-tag text-[10px] text-[#9aa2b5] hover:text-[#101527] border border-[#e0e5f0] rounded-full px-2.5 py-1">
                  LOG OUT
                </button>
              </div>
              <p className="text-[11px] text-[#9aa2b5] mt-2 truncate">{session.user.email}</p>
            </div>

            {/* 통계 — 스탬프 타일 */}
            <div className="mx-4 mb-3 stamp py-3.5 flex">
              <Stat label="방문 국가" value={stats.countries} />
              <div className="w-px bg-[#e7eaf3] my-1" />
              <Stat label="도시 기록" value={stats.cities} />
              <div className="w-px bg-[#e7eaf3] my-1" />
              <Stat label="세계 정복" value={`${stats.world}%`} sub={`${stats.countries} / 195`} accent />
            </div>

            {/* 대륙별 진행률 (국가 수 기준) */}
            <div className="mx-4 mb-3 grid grid-cols-2 gap-x-4 gap-y-2 bg-white rounded-2xl border border-[#e7eaf3] px-4 py-3">
              {stats.perCont.map(c => (
                <div key={c.name}>
                  <div className="flex items-baseline justify-between">
                    <span className="text-[10.5px] font-semibold text-[#5b6478]">{c.name}</span>
                    <span className="mono-tag text-[9px] text-[#9aa2b5]">{c.n}<span className="text-[#d3d9e8]">/{c.total}</span></span>
                  </div>
                  <div className="h-1 mt-1 rounded-full bg-[#eef0f7] overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-500"
                      style={{width:`${Math.max(c.pct, c.n ? 4 : 0)}%`, background:REVEAL[c.name]}} />
                  </div>
                </div>
              ))}
            </div>

            {/* 보고 있는 지도 선택 */}
            {shares.owners.length > 0 && (
              <div className="px-4 pb-3">
                <select value={scope} onChange={e=>{ setScope(e.target.value); setSelected(null); }}
                  className="inp text-[13px] py-2">
                  <option value="mine">🧭 내 지도</option>
                  <option value="all">👨‍👩‍👧 함께 보기 (전체)</option>
                  {shares.owners.map(o => <option key={o.other_id} value={o.other_id}>👤 {o.other_email}의 지도</option>)}
                </select>
              </div>
            )}

            <div className="px-4 pb-3 space-y-2">
              <button onClick={()=>setAddMode(!addMode)} disabled={readOnly}
                className={readOnly
                  ? "w-full rounded-xl py-3 text-sm font-semibold bg-[#eef0f7] text-[#b6bdcd] cursor-not-allowed"
                  : addMode
                    ? "w-full rounded-xl py-3 text-sm font-semibold bg-[#eef0f7] text-[#5b6478] hover:bg-[#e5e8f2] transition"
                    : "btn-p w-full"}>
                {readOnly ? "👀 보기 전용 지도예요" : addMode ? "✕ 취소 — 지도에서 나라를 클릭하세요" : "＋ 방문지 추가"}
              </button>

              <div className="flex gap-2">
                <button onClick={()=>setShowRoute(!showRoute)}
                  className={`flex-1 rounded-xl py-2 text-[12.5px] font-semibold transition border ${
                    showRoute ? "bg-[#4F46E5] text-white border-[#4F46E5]" : "bg-white text-[#5b6478] border-[#e0e5f0] hover:bg-[#f4f6fb]"}`}>
                  ✈️ 여행 경로
                </button>
                <button onClick={()=>setSharePanel(true)}
                  className="flex-1 rounded-xl py-2 text-[12.5px] font-semibold bg-white text-[#5b6478] border border-[#e0e5f0] hover:bg-[#f4f6fb] transition">
                  👥 공유 {shares.members.length > 0 && <span className="text-[#4F46E5]">{shares.members.length}</span>}
                </button>
              </div>
            </div>

            <div className="px-5 pb-2 flex items-center gap-2">
              <span className="mono-tag text-[10px] font-semibold text-[#8b93a7] uppercase tracking-widest">Travel Log</span>
              <span className="mono-tag text-[10px] text-[#b6bdcd]">{places.length}</span>
              <div className="flex-1 h-px bg-[#e7eaf3]" />
            </div>

            <div className="md:flex-1 md:min-h-0 md:overflow-y-auto card-scroll px-4 pb-5 space-y-3.5">
              {loading && <div className="text-sm text-[#9aa2b5] text-center py-8">불러오는 중…</div>}
              {!loading && loadErr &&
                <div className="text-center py-3 text-[12px] text-[#e11d48]">
                  기록을 불러오지 못했어요. <button onClick={load} className="underline font-semibold">다시 시도</button>
                </div>}
              {!loading && !loadErr && places.length === 0 &&
                <div className="text-center py-12 px-4">
                  <div className="text-4xl mb-3">✦</div>
                  <div className="display text-[15px] font-semibold text-[#101527]">아직 긁은 나라가 없어요</div>
                  <div className="text-[12.5px] text-[#8b93a7] mt-1.5 leading-relaxed">‘방문지 추가’를 누르고<br/>다녀온 나라를 지도에서 긁어보세요.</div>
                </div>}
              {tripGroups.map(g => (
                <div key={g.trip?.id || "none"} className="space-y-3.5">
                  {hasTrips && (
                    <div className="group/th flex items-center gap-2 pt-1">
                      <span className="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0"
                        style={{background: g.trip ? (g.trip.color || "#4F46E5") : "#b6bdcd"}}></span>
                      <span className="display text-[12.5px] font-bold text-[#101527] truncate">
                        {g.trip ? `🧳 ${g.trip.title}` : "미분류"}
                      </span>
                      <span className="mono-tag text-[9.5px] text-[#b6bdcd]">{g.items.length}</span>
                      {g.trip && g.trip.user_id === myId && (
                        <span className="inline-flex md:hidden md:group-hover/th:inline-flex gap-1.5">
                          <button onClick={()=>renameTrip(g.trip)} title="이름 변경"
                            className="text-[10px] text-[#9aa2b5] hover:text-[#4F46E5]">✎</button>
                          <button onClick={()=>deleteTrip(g.trip)} title="여행 삭제"
                            className="text-[10px] text-[#9aa2b5] hover:text-[#e11d48]">✕</button>
                        </span>
                      )}
                      <div className="flex-1 h-px bg-[#e7eaf3]" />
                    </div>
                  )}
                  {g.trip && g.items.length === 0 && (
                    <div className="text-[11.5px] text-[#9aa2b5] pl-4">
                      아직 방문지가 없어요 — ‘방문지 추가’에서 이 여행을 선택해보세요.
                    </div>
                  )}
                  {g.items.map(p => (
                    <DiaryCard key={p.id} p={p} active={p.id===selected}
                      onClick={()=>setSelected(p.id===selected ? null : p.id)} onDelete={()=>remove(p.id)}
                      canDelete={p.user_id === myId}
                      ownerLabel={ownerEmail(p.user_id)} />
                  ))}
                </div>
              ))}
            </div>
          </aside>

          <main className="relative flex-1 h-[55vh] md:h-full">
            <div id="map" className="scratch"></div>

            <div className="absolute top-3 left-3 z-[500] flex items-center gap-2">
              <div className="seg">
                <button className={mode==="scratch" ? "on" : ""} onClick={()=>setMode("scratch")}>✦ 스크래치</button>
                <button className={mode==="real" ? "on" : ""} onClick={()=>setMode("real")}>🛰️ 실사</button>
              </div>
              <button onClick={exportMap} title="내 지도 이미지로 저장"
                className="glass-strong w-9 h-9 rounded-full shadow-lg text-[15px] hover:scale-105 transition">📸</button>
            </div>

            {geoErr && (
              <div className="absolute inset-0 z-[600] flex items-center justify-center">
                <div className="glass-strong rounded-2xl px-5 py-4 text-center shadow-xl">
                  <div className="text-sm font-semibold text-[#101527]">국경 데이터를 불러오지 못했어요</div>
                  <div className="text-[11.5px] text-[#5b6478] mt-1">네트워크를 확인하고 다시 시도해주세요.</div>
                  <button onClick={loadGeo} className="btn-p mt-3 px-5 py-2 text-[12.5px]">다시 시도</button>
                </div>
              </div>
            )}

            {addMode && (
              <div className="fade-in absolute top-16 left-1/2 -translate-x-1/2 z-[500] text-white text-[13px] font-semibold px-4 py-2 rounded-full shadow-xl"
                style={{background:"linear-gradient(135deg,#4F46E5,#6D28D9)"}}>
                다녀온 나라를 지도에서 클릭하세요
              </div>
            )}

            {/* 경로 편집 패널 */}
            {showRoute && routeStops.length >= 2 && (
              <div className="fade-in absolute top-14 left-3 z-[500]">
                <RoutePanel groups={routeGroups} canEdit={!readOnly}
                  onReorder={saveRouteOrder} onPick={id => setSelected(id)} />
              </div>
            )}

            {/* 범례 */}
            <div className="absolute top-[62px] md:top-3 right-3 z-[500] glass-strong px-3 py-2.5 rounded-2xl shadow-lg text-[11px] text-[#3b4256] space-y-1.5">
              {scope === "all" ? (<>
                <div className="flex items-center gap-2">
                  <span className="inline-block w-3.5 h-3.5 rounded-[5px]" style={{background:"#4F46E5"}}></span>
                  내가 간 나라
                </div>
                <div className="flex items-center gap-2">
                  <span className="inline-block w-3.5 h-3.5 rounded-[5px]" style={{background:"#FB7185"}}></span>
                  친구가 간 나라
                </div>
                <div className="flex items-center gap-2">
                  <span className="inline-block w-3.5 h-3.5 rounded-[5px]"
                    style={{background:"repeating-linear-gradient(45deg,#4F46E5 0 3px,#FB7185 3px 6px)"}}></span>
                  같이 간 나라
                </div>
              </>) : mode==="scratch" ? (<>
                <div className="flex items-center gap-2">
                  <span className="inline-block w-3.5 h-3.5 rounded-[5px]" style={{background:"#5EEAD4"}}></span>
                  방문한 나라
                </div>
                <div className="flex items-center gap-2">
                  <span className="inline-block w-3.5 h-3.5 rounded-[5px]" style={{background:"#D6DBEA"}}></span>
                  미방문 나라
                </div>
              </>) : (
                <div className="flex items-center gap-2">
                  <span className="inline-block w-3.5 h-3.5 rounded-[5px] bg-[#4F46E5]/45"></span>방문한 나라
                </div>
              )}
            </div>

            {/* 선택 상세 — 티켓 스타일 */}
            {selPlace && (
              <div className="fade-in absolute bottom-4 left-4 right-4 md:left-auto md:right-4 md:w-[370px] z-[500] rounded-2xl shadow-2xl overflow-hidden bg-white">
                <div className="relative h-40 bg-cover bg-center"
                  style={ selEntry?.photo_url
                    ? { backgroundImage:`url(${selEntry.photo_url})` }
                    : { background: DEEP[selPlace.continent] || "#2563EB" } }>
                  <span className="absolute top-3 left-4 text-[38px] drop-shadow-lg" style={{transform:"rotate(-8deg)"}}>{selPlace.flag||"🌍"}</span>
                  <button onClick={()=>setSelected(null)}
                    className="absolute top-3 right-3 w-7 h-7 rounded-full bg-black/35 backdrop-blur text-white text-sm hover:bg-black/50">✕</button>
                  {selEntry?.photo_url && <div className="absolute bottom-0 left-0 right-0 h-20 bg-gradient-to-t from-black/60 to-transparent" />}
                  <div className="absolute bottom-3 left-4 right-4 text-white">
                    <div className="display text-[19px] font-bold leading-tight">{selPlace.city}</div>
                    <div className="mono-tag text-[10px] text-white/80 mt-0.5 uppercase">
                      {selPlace.country_ko||selPlace.country}{selPlace.visited_at ? ` · ${selPlace.visited_at}` : ""}
                    </div>
                  </div>
                </div>

                <div className="perf" style={{"--notch":"#140F2E"}}></div>

                <div className="px-4 pt-3.5 pb-4">
                  {selPlace.trip_id && tripById.has(selPlace.trip_id) && (
                    <span className="inline-flex items-center gap-1.5 mb-2 text-[10.5px] font-semibold px-2 py-1 rounded-full"
                      style={{background:`${tripColor(selPlace.trip_id)}1a`, color:tripColor(selPlace.trip_id)}}>
                      🧳 {tripById.get(selPlace.trip_id).title}
                    </span>
                  )}
                  {selEntry ? (<>
                    <h3 className="display font-bold text-[#101527] text-[17px] leading-snug">{selEntry.title}</h3>
                    {selEntry.body && <p className="text-[13.5px] text-[#5b6478] mt-2 leading-relaxed whitespace-pre-wrap">{selEntry.body}</p>}
                  </>) : <div className="text-[13.5px] text-[#9aa2b5]">다이어리가 아직 없어요.</div>}

                  {/* 인스타 게시글 임베드 (공개 게시글만 표시됨) */}
                  {selEntry?.insta_url && (instaEmbed(selEntry.insta_url)
                    ? <iframe src={instaEmbed(selEntry.insta_url)} loading="lazy"
                        className="w-full h-[400px] mt-3 rounded-xl border border-[#e7eaf3] bg-[#fafafa]"></iframe>
                    : <a href={selEntry.insta_url} target="_blank" rel="noreferrer"
                        className="block mt-3 text-[12.5px] font-semibold text-[#4F46E5] hover:underline">📷 인스타에서 보기 ↗</a>)}

                  {SHOW_RATINGS && <GoogleRating place={selPlace} canFetch={selPlace.user_id === myId} />}

                  {selPlace.user_id === myId && (
                    <button onClick={()=>setEditing(selPlace)}
                      className="mt-3 w-full rounded-xl py-2 text-[12.5px] font-semibold bg-white text-[#5b6478] border border-[#e0e5f0] hover:bg-[#f4f6fb] transition">
                      ✏️ 다이어리 {selEntry ? "수정" : "쓰기"} · 방문일 변경
                    </button>
                  )}
                </div>
              </div>
            )}
          </main>

          {pending && <AddModal pending={pending} trips={myTrips} onClose={()=>setPending(null)}
            onSaved={()=>{ revealRef.current = pending.country; setPending(null); load(); }} />}

          {editing && <EditModal place={editing} trips={myTrips} onClose={()=>setEditing(null)}
            onSaved={()=>{ setEditing(null); load(); }} />}

          {sharePanel && <SharePanel shares={shares} onChanged={load} onClose={()=>setSharePanel(false)} />}
        </div>
      );
    }

    function Root() {
      const [session, setSession] = useState(undefined);
      useEffect(() => {
        sb.auth.getSession().then(({data}) => setSession(data.session));
        const { data:{ subscription } } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
        return () => subscription.unsubscribe();
      }, []);
      if (session === undefined) return <div className="h-screen flex items-center justify-center text-[#5b6478]">불러오는 중…</div>;
      return session ? <MapApp session={session} /> : <AuthScreen />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
