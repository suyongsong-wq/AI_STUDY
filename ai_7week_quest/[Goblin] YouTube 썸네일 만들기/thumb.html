<meta charset="utf-8">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#000; }
  .stage { position:relative; width:1920px; height:1080px; overflow:hidden; }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
        filter:saturate(1.12) contrast(1.04) brightness(1.02); }
  /* 가독성용 스크림 — 상단/하단만 아주 옅게 */
  .scrim { position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(0,40,60,.28) 0%, rgba(0,40,60,0) 34%),
      linear-gradient(0deg,  rgba(0,40,60,.34) 0%, rgba(0,40,60,0) 26%); }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; }

  .eyebrow { margin-top:62px; font-family:"Helvetica Neue",Pretendard,sans-serif; font-weight:250;
    font-size:46px; letter-spacing:.30em; color:#fff; text-indent:.30em;
    text-shadow:0 2px 24px rgba(0,50,70,.45); }

  .hero { margin-top:14px; font-family:Didot,"Bodoni 72",serif; font-weight:400;
    font-size:248px; line-height:.94; color:#fff; letter-spacing:-.012em;
    text-shadow:0 6px 44px rgba(0,45,65,.42); white-space:nowrap; }
  .hero .accent { color:var(--accent); }

  .krline { margin-top:66px; font-family:Pretendard,sans-serif; font-weight:600;
    font-size:47px; letter-spacing:-.02em; color:#fff;
    text-shadow:0 3px 26px rgba(0,45,65,.6); }

  .foot { position:absolute; left:0; right:0; bottom:44px; display:flex;
          flex-direction:column; align-items:center; }
  .badge { font-family:Didot,serif; font-style:italic; font-size:34px; color:#fff;
    border:2.5px solid #fff; border-radius:999px; padding:7px 34px; letter-spacing:.04em; }
  .tagline { margin-top:14px; font-family:Didot,serif; font-style:italic; font-weight:700;
    font-size:33px; color:#fff; letter-spacing:.01em; text-shadow:0 2px 16px rgba(0,45,65,.55); }
  .tracks { margin-top:12px; font-family:"Helvetica Neue",sans-serif; font-weight:300;
    font-size:19px; line-height:1.55; color:rgba(255,255,255,.82); text-align:center;
    letter-spacing:.02em; }
</style>
<div class="stage">
  <img class="bg" id="bg">
  <div class="scrim"></div>
  <div class="wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="hero" id="hero"></div>
    <div class="krline" id="kr"></div>
  </div>
  <div class="foot">
    <div class="badge">OOOffi</div>
    <div class="tagline">Out of Office, into the Music.</div>
    <!-- 실제 트랙리스트 — 영상 설명란 133집 "Own the Day" 에서 가져옴 -->
    <div class="tracks">
      Own the Day · Ocean, Still Calling · Cool Summer · Fresh Dive · Sparkling Wave · Cool Breeze<br>
      Ice Blue · Cool Ocean Heart · Ocean Spark · Fresh Coast · Summer Soda · Cafe Glow · replay
    </div>
  </div>
</div>
<script>
  const V = {
    a: { img:'a.jpg',  accent:'#FFD84D',
         eyebrow:'WHERE : BACKYARD POOL, PALM SPRINGS',
         hero:['summer ','pop'],
         kr:'첫 곡부터 기분 좋아지는 여름 플리' },
    b: { img:'b.jpg',  accent:'#FFC24A',
         eyebrow:'WHERE : POOLSIDE, 5PM',
         hero:['cool ','down'],
         kr:'올여름 내내 듣게 될 청량팝 모음' },
  };
  const v = V[(location.hash || '#a').slice(1)] || V.a;
  document.documentElement.style.setProperty('--accent', v.accent);
  bg.src = v.img;
  eyebrow.textContent = v.eyebrow;
  hero.innerHTML = v.hero[0] + '<span class="accent">' + v.hero[1] + '</span>';
  kr.textContent = v.kr;
</script>
