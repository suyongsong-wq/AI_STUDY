<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141210"/>
      <stop offset="0.5" stop-color="#23211d"/>
      <stop offset="1" stop-color="#0f0d0b"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f8478"/>
      <stop offset="0.5" stop-color="#cfc6ba"/>
      <stop offset="1" stop-color="#7d7266"/>
