    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#glow)"/>
  <ellipse cx="150" cy="372" rx="96" ry="15" fill="#000" opacity="0.5"/>

  <!-- 봉투 -->
  <path d="M72 92 h156 v270 a12 12 0 0 1 -12 12 h-132 a12 12 0 0 1 -12 -12 z" fill="url(#bag)"/>
  <rect x="82" y="92" width="8" height="282" fill="#ffffff" opacity="0.05"/>
