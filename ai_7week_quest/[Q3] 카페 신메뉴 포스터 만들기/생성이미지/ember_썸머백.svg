    <line x1="126" y1="66" x2="124" y2="92"/><line x1="150" y1="66" x2="150" y2="92"/>
    <line x1="174" y1="66" x2="176" y2="92"/><line x1="198" y1="66" x2="202" y2="92"/>
    <line x1="222" y1="66" x2="228" y2="92"/>
