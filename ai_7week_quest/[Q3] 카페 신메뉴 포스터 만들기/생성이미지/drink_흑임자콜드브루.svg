<svg xmlns="http://www.w3.org/2000/svg" width="460" height="640" viewBox="0 0 460 640">
  <defs>
    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2f22"/>
      <stop offset="0.5" stop-color="#241a11"/>
      <stop offset="1" stop-color="#160f08"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ead3"/>
      <stop offset="1" stop-color="#e4d2ac"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.15" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.85" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cfe6e2" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2e6f66" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2e6f66" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 뒤 후광 -->
  <ellipse cx="230" cy="300" rx="240" ry="270" fill="url(#halo)"/>

  <!-- 바닥 그림자 -->
  <ellipse cx="230" cy="606" rx="150" ry="26" fill="#000" opacity="0.4"/>

  <!-- 유리컵 (하이볼) -->
  <g>
    <!-- 음료: 콜드브루 -->
    <path d="M126 200 h208 l-20 380 a84 22 0 0 1 -168 0 z" fill="url(#brew)"/>
    <!-- 흑임자 크림 층 -->
    <path d="M126 200 h208 l-6 108 a104 26 0 0 1 -196 0 z" fill="url(#cream)"/>
    <!-- 크림-브루 경계 물결 -->
    <path d="M132 300 q50 22 98 6 q48 -16 96 8 l-2 14 q-48 -22 -96 -6 q-48 16 -98 -6 z"
      fill="#c9a86f" opacity="0.5"/>
    <!-- 크림 윗면 타원 -->
    <ellipse cx="230" cy="200" rx="104" ry="24" fill="#f7efda"/>
    <ellipse cx="230" cy="200" rx="104" ry="24" fill="none" stroke="#e7d6b0" stroke-width="2"/>

    <!-- 흑임자 알갱이 (크림 위) -->
    <g fill="#2a2018">
      <circle cx="196" cy="196" r="3.4"/><circle cx="250" cy="200" r="3"/>
      <circle cx="224" cy="192" r="2.6"/><circle cx="270" cy="194" r="2.4"/>
      <circle cx="180" cy="203" r="2.4"/><circle cx="238" cy="206" r="2.2"/>
      <circle cx="210" cy="205" r="2"/>
    </g>

    <!-- 얼음 (콜드브루 속) -->
    <g fill="url(#ice)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
      <rect x="150" y="340" width="70" height="66" rx="12" transform="rotate(-12 185 373)"/>
      <rect x="238" y="392" width="66" height="62" rx="12" transform="rotate(14 271 423)"/>
      <rect x="172" y="440" width="60" height="58" rx="11" transform="rotate(8 202 469)"/>
    </g>

    <!-- 유리 하이라이트/몸통 -->
    <path d="M126 200 h208 l-20 380 a84 22 0 0 1 -168 0 z" fill="url(#glass)"/>
    <path d="M126 200 h208 l-20 380 a84 22 0 0 1 -168 0 z" fill="none"
      stroke="#ffffff" stroke-opacity="0.32" stroke-width="3"/>
    <path d="M150 214 l-15 350" stroke="#ffffff" stroke-opacity="0.28" stroke-width="7"
      stroke-linecap="round"/>
    <path d="M312 220 l-13 330" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10"
      stroke-linecap="round"/>

    <!-- 빨대 -->
    <rect x="286" y="120" width="16" height="110" rx="8" fill="#1e4f49"/>
    <rect x="286" y="120" width="16" height="110" rx="8" fill="#ffffff" opacity="0.12"/>
    <rect x="290" y="120" width="4" height="90" rx="2" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- 물방울 (시원함) -->
  <g fill="#cfe6e2" opacity="0.6">
    <ellipse cx="120" cy="360" rx="5" ry="8"/><ellipse cx="112" cy="430" rx="4" ry="7"/>
    <ellipse cx="126" cy="500" rx="4.5" ry="7"/><ellipse cx="344" cy="380" rx="5" ry="8"/>
    <ellipse cx="350" cy="460" rx="4" ry="7"/><ellipse cx="338" cy="530" rx="4.5" ry="7"/>
  </g>
</svg>
