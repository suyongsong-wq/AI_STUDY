    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
