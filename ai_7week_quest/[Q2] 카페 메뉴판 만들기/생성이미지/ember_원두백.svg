<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141210"/>
      <stop offset="0.5" stop-color="#22201d"/>
      <stop offset="1" stop-color="#0f0d0b"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f8478"/>
      <stop offset="0.5" stop-color="#cfc6ba"/>
      <stop offset="1" stop-color="#7d7266"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" fill="#0b0a09"/>
  <rect width="240" height="240" fill="url(#glow)"/>

  <!-- 바닥 그림자 -->
  <ellipse cx="120" cy="214" rx="72" ry="12" fill="#000" opacity="0.5"/>

  <!-- 봉투 몸통 -->
  <path d="M62 60 h116 v150 a10 10 0 0 1 -10 10 h-96 a10 10 0 0 1 -10 -10 z" fill="url(#bag)"/>
  <!-- 측면 하이라이트 -->
  <rect x="70" y="60" width="7" height="160" fill="#ffffff" opacity="0.05"/>
  <rect x="163" y="60" width="9" height="160" fill="#000" opacity="0.28"/>

  <!-- 상단 압착 실링 (포일) -->
  <path d="M58 40 h124 l-8 22 h-108 z" fill="url(#foil)"/>
  <g stroke="#0b0a09" stroke-width="2" opacity="0.4">
    <line x1="66" y1="42" x2="62" y2="60"/><line x1="82" y1="42" x2="80" y2="60"/>
    <line x1="98" y1="42" x2="98" y2="60"/><line x1="114" y1="42" x2="116" y2="60"/>
    <line x1="130" y1="42" x2="132" y2="60"/><line x1="146" y1="42" x2="150" y2="60"/>
    <line x1="162" y1="42" x2="168" y2="60"/>
  </g>

  <!-- 앰버 라벨 밴드 -->
  <rect x="62" y="112" width="116" height="46" fill="#ff5a1f"/>
  <text x="120" y="132" text-anchor="middle" fill="#0b0a09"
    font-family="'Space Mono',monospace" font-size="13" font-weight="700"
    letter-spacing="2">SIGNATURE</text>
  <text x="120" y="149" text-anchor="middle" fill="#0b0a09"
    font-family="'Space Mono',monospace" font-size="10" letter-spacing="3">BLEND · 200G</text>

  <!-- ✳ 마크 -->
  <text x="120" y="96" text-anchor="middle" fill="#ff5a1f"
    font-family="'Space Grotesk',sans-serif" font-size="26" font-weight="700">✳</text>

  <!-- 로스트 스탬프 -->
  <text x="120" y="184" text-anchor="middle" fill="#ece6dc"
    font-family="'Space Mono',monospace" font-size="9" letter-spacing="3" opacity="0.85">ROASTED TO ORDER</text>

  <!-- 원두 몇 알 -->
  <g fill="#1c140d" stroke="#3a2a1c" stroke-width="1">
    <ellipse cx="86" cy="214" rx="9" ry="6" transform="rotate(-18 86 214)"/>
    <ellipse cx="150" cy="216" rx="9" ry="6" transform="rotate(22 150 216)"/>
    <ellipse cx="120" cy="220" rx="9" ry="6" transform="rotate(-6 120 220)"/>
  </g>
  <g stroke="#000" stroke-width="1" opacity="0.6" fill="none">
    <path d="M82 210 q4 4 8 0"/><path d="M146 212 q4 4 8 0"/><path d="M116 216 q4 4 8 0"/>
  </g>
</svg>
