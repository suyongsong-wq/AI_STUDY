  <g fill="#26221c">
    <circle cx="95" cy="112" r="2.4"/><circle cx="147" cy="113" r="2.2"/>
    <circle cx="120" cy="126" r="2"/><circle cx="134" cy="107" r="1.8"/>
    <circle cx="106" cy="106" r="1.7"/>
