<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f24"/>
      <stop offset="0.6" stop-color="#2a231c"/>
      <stop offset="1" stop-color="#1d1813"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#7a6650" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a6650" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe7d8"/>
      <stop offset="0.5" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#ddd2bf"/>
    </linearGradient>
    <radialGradient id="foam" cx="0.42" cy="0.4" r="0.72">
      <stop offset="0" stop-color="#f0e4ce"/>
      <stop offset="0.7" stop-color="#e2d2b4"/>
      <stop offset="1" stop-color="#c9b593"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" fill="url(#bg)"/>
  <rect width="240" height="240" fill="url(#glow)"/>

  <!-- 스팀 -->
  <g stroke="#efe6d6" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.22">
    <path d="M104 78 q-12 -24 3 -46 q13 -22 0 -42"/>
    <path d="M134 78 q12 -24 -3 -46 q-13 -22 0 -42"/>
  </g>

  <!-- 받침 그림자/받침 -->
