  <path d="M186 116 q40 4 40 42 q0 38 -40 42" fill="none" stroke="#e2d7c3" stroke-width="16"/>
  <path d="M186 116 q31 4 31 42 q0 38 -31 42" fill="none" stroke="#fffdf8" stroke-width="6"/>

  <!-- 컵 몸통 -->
  <path d="M50 116 h140 l-10 78 a60 22 0 0 1 -120 0 z" fill="url(#cup)"/>
  <ellipse cx="120" cy="116" rx="70" ry="22" fill="#e8e0d0"/>
  <ellipse cx="120" cy="116" rx="63" ry="19" fill="url(#foam)"/>

