<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* 표준 명함 90×54mm @300dpi = 1063×638px */
  html,body{width:1063px;height:638px;overflow:hidden;
    font-family:Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  :root{
    --blue:#3182F6; --blue-d:#1B64DA;
    --g900:#191F28; --g700:#4E5968; --g500:#8B95A1; --g200:#E5E8EB; --g50:#F9FAFB;
  }
  .mono{font-family:"JetBrains Mono",monospace}

  .card{position:relative;width:1063px;height:638px;background:#fff;overflow:hidden}

  /* ── 앞면 ── */
  .front{padding:64px 72px;display:flex;flex-direction:column}
  .front .edge{position:absolute;left:0;top:0;bottom:0;width:12px;
    background:linear-gradient(180deg,#3182F6,#1B64DA)}
  .chip{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;
    background:var(--g50);border:1px solid var(--g200);border-radius:999px;
    padding:9px 18px;font-size:20px;font-weight:700;color:var(--blue);letter-spacing:.02em}
  .name{margin-top:auto;font-size:96px;font-weight:800;color:var(--g900);
    letter-spacing:-.045em;line-height:1;display:flex;align-items:baseline;gap:18px}
  .name small{font-size:32px;font-weight:500;color:var(--g500);letter-spacing:0}
  .role{margin-top:20px;font-size:33px;font-weight:700;color:var(--g900);letter-spacing:-.03em}
  .role em{font-style:normal;color:var(--blue);
    box-shadow:inset 0 -12px 0 rgba(49,130,246,.14)}

  .contact{margin-top:auto;display:flex;gap:56px;padding-top:34px;border-top:1px solid var(--g200)}
  .ci .lb{font-size:16px;font-weight:700;color:var(--g500);letter-spacing:.12em}
  .ci .vl{margin-top:8px;font-size:25px;font-weight:600;color:var(--g900);letter-spacing:-.01em}

  /* ── 뒷면 ── */
  .back{background:var(--g900);padding:64px 72px;display:flex;flex-direction:column;
    justify-content:space-between}
  .back .btop{}
  .back .bk{font-size:20px;font-weight:700;color:var(--blue);letter-spacing:.14em}
  .back .bstmt{margin-top:24px;font-size:52px;font-weight:800;color:#fff;
    letter-spacing:-.035em;line-height:1.28}
  .back .bstmt em{font-style:normal;color:var(--blue)}
  .back .bbot{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
  .back .binfo .bl{font-size:16px;font-weight:700;color:var(--g500);letter-spacing:.12em}
  .back .binfo .bv{margin-top:9px;font-size:26px;font-weight:600;color:#fff;letter-spacing:-.01em}
  .back .binfo .bv2{margin-top:6px;font-size:22px;font-weight:500;color:var(--g500)}
  .back .qr{width:150px;height:150px;flex:none;border-radius:14px;overflow:hidden;
    background:#fff;padding:10px}
  .back .qr img{width:100%;height:100%;display:block}
</style>

<!-- ══ 앞면 ══ -->
<div class="card front" id="front">
  <div class="edge"></div>
  <div class="chip">🏭 AI 공장장 부트캠프 3기</div>
  <div class="name">송수용<small>suyong</small></div>
  <div class="role">만들면서 배우는 <em>실용주의 빌더</em></div>
  <div class="contact">
    <div class="ci"><div class="lb">EMAIL</div><div class="vl mono">suyong.song@griff.co.kr</div></div>
    <div class="ci"><div class="lb">GITHUB</div><div class="vl mono">github.com/suyongsong-wq</div></div>
  </div>
</div>

<!-- ══ 뒷면 ══ -->
<div class="card back" id="back">
  <div class="btop">
    <div class="bk">HOW I WORK</div>
    <div class="bstmt">개념만 듣지 않습니다.<br><em>작동하는 걸</em> 손으로 만듭니다.</div>
  </div>
  <div class="bbot">
    <div class="binfo">
      <div class="bl">MADE</div>
      <div class="bv">웹앱 · AI 에이전트 · 쇼핑몰 20+</div>
      <div class="bv2">부트캠프 2 → 7주차, 손으로 만든 기록</div>
    </div>
    <div class="qr"><img id="qr"></div>
  </div>
</div>

<script>
  const url = 'https://github.com/suyongsong-wq';
  document.getElementById('qr').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data=' + encodeURIComponent(url);
  const side = new URLSearchParams(location.search).get('side') || 'front';
  document.getElementById(side === 'back' ? 'front' : 'back').style.display = 'none';
</script>
