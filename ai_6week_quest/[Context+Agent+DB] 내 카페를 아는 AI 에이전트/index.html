<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>☕ 내 카페를 아는 AI 에이전트 — 하버스카페</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .fade { animation: fade .35s ease; } @keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
</style>
</head>
<body class="bg-stone-100 text-stone-800">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const won = (n) => (n == null ? '-' : Number(n).toLocaleString('ko-KR') + '원');

const PRESETS = [
  '신메뉴 뭐 추가할까?',
  '어느 요일에 어떤 프로모션을 하면 좋을까?',
  '리뷰에서 가장 먼저 고쳐야 할 건 뭐야?',
  '객단가를 올리려면 어떻게 해야 해?',
  '마케팅 예산 50만원, 어디에 써야 효과적일까?',
];

function Stat({ label, value, sub }) {
  return (
    <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200">
      <div className="text-xs text-stone-500">{label}</div>
      <div className="text-xl font-bold mt-1">{value}</div>
      {sub && <div className="text-xs text-stone-400 mt-0.5">{sub}</div>}
    </div>
  );
}

function Dashboard({ data }) {
  if (!data) return <div className="text-stone-400 text-sm">운영 데이터 불러오는 중…</div>;
  const s = data.summary;
  const top = data.menu[0];
  const quietDow = [...data.byDow].sort((a, b) => a.avg_rev - b.avg_rev)[0];
  const worstTheme = [...data.reviewThemes].sort((a, b) => a.avg_rating - b.avg_rating)[0];
  const maxRev = Math.max(...data.byDow.map((d) => d.avg_rev));
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label={`총매출 (${s.days}일)`} value={won(s.revenue)} sub={`${s.from} ~ ${s.to}`} />
        <Stat label="총 손님" value={Number(s.customers).toLocaleString('ko-KR') + '명'} />
        <Stat label="매출 1위 메뉴" value={top.menu} sub={won(top.amount)} />
        <Stat label="가장 한산한 요일" value={quietDow.dow} sub={`평균 ${won(quietDow.avg_rev)}`} />
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200">
          <div className="font-semibold mb-3 text-sm">메뉴별 매출 TOP</div>
          {data.menu.map((m) => (
            <div key={m.menu} className="mb-2">
              <div className="flex justify-between text-xs mb-0.5"><span>{m.menu}</span><span className="text-stone-500">{won(m.amount)} · {m.qty}개</span></div>
              <div className="h-2 bg-stone-100 rounded-full overflow-hidden">
                <div className="h-full bg-amber-700 rounded-full" style={{ width: (m.amount / data.menu[0].amount * 100) + '%' }} />
              </div>
            </div>
          ))}
        </div>
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200">
          <div className="font-semibold mb-3 text-sm">요일별 평균 매출</div>
          <div className="flex items-end gap-1.5 h-32">
            {data.byDow.map((d) => (
              <div key={d.dow} className="flex-1 h-full flex flex-col items-center justify-end">
                <div className="w-full bg-amber-600/80 rounded-t" style={{ height: (d.avg_rev / maxRev * 100) + '%' }} title={won(d.avg_rev)} />
                <div className="text-[10px] text-stone-500 mt-1">{d.dow}</div>
              </div>
            ))}
          </div>
          <div className="mt-3 pt-3 border-t border-stone-100">
            <div className="font-semibold mb-2 text-sm">리뷰 테마별 평점</div>
            <div className="flex flex-wrap gap-1.5">
              {data.reviewThemes.map((t) => (
                <span key={t.theme} className={"text-[11px] px-2 py-1 rounded-full " + (t.avg_rating <= 3 ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700')}>
                  {t.theme} ★{t.avg_rating}
                </span>
              ))}
            </div>
            <div className="text-[11px] text-red-600 mt-2">⚠ 개선 우선순위: <b>{worstTheme.theme}</b> (★{worstTheme.avg_rating})</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Answer({ tone, title, badge, note, text, loading }) {
  const isAfter = tone === 'after';
  return (
    <div className={"rounded-2xl border p-4 " + (isAfter ? 'border-amber-300 bg-amber-50' : 'border-stone-200 bg-white')}>
      <div className="flex items-center gap-2 mb-1">
        <span className={"text-xs font-bold px-2 py-0.5 rounded-full " + (isAfter ? 'bg-amber-700 text-white' : 'bg-stone-300 text-stone-700')}>{badge}</span>
        <span className="text-sm font-semibold">{title}</span>
      </div>
      <div className="text-[11px] text-stone-400 mb-3">{note}</div>
      {loading
        ? <div className="text-stone-400 text-sm">생각 중… 🤔</div>
        : <div className="text-sm leading-relaxed whitespace-pre-wrap fade">{text || '위에서 질문을 던져보세요.'}</div>}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [q, setQ] = useState('');
  const [res, setRes] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  useEffect(() => {
    fetch('/api/cafe-data').then((r) => r.json()).then((j) => j.success && setData(j.data)).catch(() => {});
  }, []);

  async function ask(question) {
    const text = (question || q).trim();
    if (!text || loading) return;
    setQ(text); setLoading(true); setErr(''); setRes(null);
    try {
      const r = await fetch('/api/ask', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text }),
      });
      const j = await r.json();
      if (!j.success) throw new Error(j.message);
      setRes(j);
    } catch (e) { setErr(e.message); }
    setLoading(false);
  }

  return (
    <div className="max-w-5xl mx-auto p-4 md:p-8">
      <header className="mb-6">
        <div className="flex items-center gap-2">
          <span className="text-3xl">☕</span>
          <h1 className="text-2xl font-bold">내 카페를 아는 AI 에이전트</h1>
        </div>
        <p className="text-stone-500 text-sm mt-1">
          <b>하버스카페</b> · <code className="bg-stone-200 px-1 rounded">my_cafe.md</code>(컨셉) + Supabase 운영 DB를 결합한 맞춤형 운영 파트너
        </p>
        <p className="text-stone-400 text-xs mt-1">같은 질문을 <b>일반 AI</b>와 <b>내 카페 에이전트</b>에 동시에 던져 <b>Before / After</b>를 비교합니다. (두 답변 모두 실제 Gemini 호출)</p>
      </header>

      <section className="mb-6"><Dashboard data={data} /></section>

      <section className="bg-white rounded-2xl p-4 md:p-5 shadow-sm border border-stone-200">
        <div className="text-xs font-semibold text-stone-500 mb-2">이런 걸 물어보세요</div>
        <div className="flex flex-wrap gap-2 mb-3">
          {PRESETS.map((p) => (
            <button key={p} onClick={() => ask(p)} disabled={loading}
              className="text-xs px-3 py-1.5 rounded-full bg-stone-100 hover:bg-amber-100 border border-stone-200 disabled:opacity-50">
              {p}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && ask()}
            placeholder="내 카페 운영에 대해 물어보세요…"
            className="flex-1 px-4 py-2.5 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm" />
          <button onClick={() => ask()} disabled={loading}
            className="px-5 py-2.5 rounded-xl bg-amber-700 text-white text-sm font-semibold hover:bg-amber-800 disabled:opacity-50 whitespace-nowrap">
            {loading ? '분석 중…' : '비교 질문'}
          </button>
        </div>

        {err && <div className="mt-3 text-sm text-red-600 bg-red-50 rounded-xl p-3">⚠ {err}</div>}

        {(res || loading) && (
          <div className="grid md:grid-cols-2 gap-4 mt-4">
            <Answer tone="before" badge="BEFORE" title="일반 AI (컨텍스트 없음)"
              note="my_cafe.md·DB 모름" text={res && res.generic} loading={loading} />
            <Answer tone="after" badge="AFTER" title="내 카페 에이전트 (my_cafe.md + DB)"
              note="my_cafe.md + 운영 DB를 읽고 답함" text={res && res.custom} loading={loading} />
          </div>
        )}
      </section>

      <footer className="text-center text-xs text-stone-400 mt-8">
        Context(my_cafe.md) + 운영 DB(Supabase) + LLM(Gemini) · 하버스스쿨 AI 부트캠프 6주차
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
