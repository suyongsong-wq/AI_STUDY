<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="'Segoe UI', sans-serif">
  <rect width="520" height="320" fill="#fff7ed"/>
  <text x="260" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#c2410c">🍽️ 두부 스테이크 &amp; 대파 뵈르블랑</text>
  <text x="260" y="64" text-anchor="middle" font-size="13" fill="#9a3412">미슐랭 셰프 양식 모드 · 약 320kcal</text>

  <!-- plate -->
  <ellipse cx="260" cy="195" rx="170" ry="95" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
  <ellipse cx="260" cy="195" rx="120" ry="62" fill="#fffdf9" stroke="#fde7c8" stroke-width="2"/>

  <!-- 대파 뵈르블랑 소스 swoosh -->
  <path d="M175 215 Q240 245 345 205" fill="none" stroke="#a7d676" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- 두부 스테이크 -->
  <g transform="rotate(-8 250 190)">
    <rect x="205" y="165" width="100" height="52" rx="8" fill="#f6e7c1" stroke="#e3c884" stroke-width="2"/>
    <line x1="218" y1="178" x2="296" y2="178" stroke="#d9b066" stroke-width="3" opacity="0.6"/>
    <line x1="218" y1="192" x2="296" y2="192" stroke="#d9b066" stroke-width="3" opacity="0.6"/>
    <line x1="218" y1="206" x2="296" y2="206" stroke="#d9b066" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- 수란 (poached egg) -->
  <ellipse cx="262" cy="168" rx="28" ry="22" fill="#fffefb" stroke="#f3eada" stroke-width="2"/>
  <circle cx="262" cy="168" r="11" fill="#ffb703"/>

  <!-- 김치 타르타르 가니시 -->
  <circle cx="340" cy="180" r="9" fill="#e0533a"/>
  <circle cx="352" cy="190" r="6" fill="#d6452e"/>
  <circle cx="332" cy="192" r="5" fill="#ef6a4f"/>

  <!-- 대파 채 고명 -->
  <line x1="245" y1="150" x2="258" y2="158" stroke="#7cb342" stroke-width="3" stroke-linecap="round"/>
  <line x1="255" y1="148" x2="266" y2="157" stroke="#8bc34a" stroke-width="3" stroke-linecap="round"/>

  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#c79a6a">🍳 냉장고 재료 기반 레시피 스킬 · SVG 일러스트</text>
</svg>
