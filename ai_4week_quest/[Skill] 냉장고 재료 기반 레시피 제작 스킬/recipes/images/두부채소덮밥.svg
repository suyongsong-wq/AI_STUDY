  <!-- 시금치 나물 -->
  <path d="M170 195 q15 -22 35 -6 q-8 16 -32 14 z" fill="#4f8a3a"/>
  <path d="M178 205 q12 -16 28 -4" fill="none" stroke="#3f7a2e" stroke-width="3"/>

  <!-- 콩나물 -->
  <g stroke="#e8d36a" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="180" x2="320" y2="200"/>
    <line x1="312" y1="178" x2="330" y2="200"/>
    <line x1="324" y1="180" x2="340" y2="202"/>
  </g>
  <circle cx="300" cy="179" r="4" fill="#f4e7a0"/>
