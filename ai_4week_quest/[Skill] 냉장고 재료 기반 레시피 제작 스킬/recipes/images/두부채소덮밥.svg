  <circle cx="324" cy="179" r="4" fill="#f4e7a0"/>

  <!-- 애호박 슬라이스 -->
  <circle cx="225" cy="210" r="13" fill="#bfe06a" stroke="#a6cc4f" stroke-width="2"/>
  <circle cx="225" cy="210" r="5" fill="#e4f3b8"/>

  <!-- 두부 큐브 -->
  <rect x="252" y="172" width="34" height="26" rx="4" fill="#f6e7c1" stroke="#e3c884" stroke-width="2"/>

  <!-- 반숙 계란 -->
  <ellipse cx="290" cy="218" rx="22" ry="16" fill="#fffefb" stroke="#f0e8d8" stroke-width="2"/>
  <circle cx="290" cy="218" r="8" fill="#ffb703"/>

  <!-- 김 가루 -->
