<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sweet Spot · 디저트 샵</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn .25s ease-out; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .animate-slide-in { animation: slideIn .28s ease-out; }
    body { font-family: 'Apple SD Gothic Neo', 'Pretendard', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-rose-50/40 text-stone-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;

    // ========================================
    // ⚙️ Supabase 클라이언트 초기화
    // ========================================
    const SUPABASE_URL = 'https://ibxhnwovdtnfttfzqpos.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7RB2j_pC9YcoPG5N1n8uZg_p12ndXjr'; // publishable, 공개 안전 (보안은 RLS가 담당)
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const FREE_SHIPPING_THRESHOLD = 30000;
    const won = (n) => (n ?? 0).toLocaleString('ko-KR') + '원';

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, type = 'button', className = '', children }) {
      const base = 'inline-flex items-center justify-center gap-1.5 font-semibold rounded-xl transition active:scale-[.97] disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-rose-300';
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2.5 text-sm', lg: 'px-6 py-3 text-base' };
      const variants = {
        primary: 'bg-rose-500 text-white hover:bg-rose-600 shadow-sm shadow-rose-200',
        secondary: 'bg-white text-stone-700 border border-stone-200 hover:bg-stone-50',
        danger: 'bg-white text-red-500 border border-red-200 hover:bg-red-50',
        ghost: 'text-stone-500 hover:bg-stone-100',
      };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
          className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    }

    function Input({ label, type = 'text', value, onChange, placeholder, error, disabled, autoComplete }) {
      return (
        <label className="block">
          {label && <span className="block mb-1 text-sm font-medium text-stone-600">{label}</span>}
          <input type={type} value={value} onChange={onChange} placeholder={placeholder}
            disabled={disabled} autoComplete={autoComplete}
            className={`w-full px-4 py-2.5 rounded-xl border bg-white text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 transition
              ${error ? 'border-red-300 focus:ring-red-200' : 'border-stone-200 focus:ring-rose-200 focus:border-rose-300'}`} />
          {error && <span className="block mt-1 text-xs text-red-500">{error}</span>}
        </label>
      );
    }

    function Badge({ children, className = '' }) {
      return <span className={`inline-block px-2.5 py-0.5 text-xs font-semibold rounded-full ${className}`}>{children}</span>;
    }

    function Card({ children, className = '' }) {
      return <div className={`bg-white rounded-2xl shadow-sm border border-stone-100 ${className}`}>{children}</div>;
    }

    function Modal({ isOpen, onClose, title, children, size = 'md' }) {
      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-lg' };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 animate-fade-in" onClick={onClose}>
          <Card className={`w-full ${sizes[size]} p-6 animate-fade-in`} >
            <div onClick={(e) => e.stopPropagation()}>
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-lg font-bold text-stone-800">{title}</h3>
                <button onClick={onClose} className="text-stone-400 hover:text-stone-600 text-xl leading-none" aria-label="닫기">×</button>
              </div>
              {children}
            </div>
          </Card>
        </div>
      );
    }

    function Spinner({ className = '' }) {
      return (
        <svg className={`animate-spin h-5 w-5 ${className}`} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
      );
    }

    // ========================================
    // 🖼️ 상품 이미지 (onError 폴백)
    // ========================================
    // 상품명별 폴백 비주얼(이모지+그라데이션) — 사진이 안 떠도 상품마다 다르게 보이도록
    const PRODUCT_VISUALS = [
      { kw: '마카롱', emoji: '🌈', tone: 'from-pink-100 to-rose-200' },
      { kw: '휘낭시에', emoji: '🧈', tone: 'from-amber-100 to-yellow-200' },
      { kw: '까눌레', emoji: '🍮', tone: 'from-orange-100 to-amber-200' },
      { kw: '스콘', emoji: '🥐', tone: 'from-yellow-100 to-orange-100' },
      { kw: '치즈케이크', emoji: '🧀', tone: 'from-amber-100 to-rose-100' },
      { kw: '딸기', emoji: '🍓', tone: 'from-rose-100 to-pink-200' },
      { kw: '쿠키', emoji: '🍪', tone: 'from-amber-200 to-orange-200' },
      { kw: '다쿠아즈', emoji: '🥮', tone: 'from-yellow-100 to-amber-100' },
      { kw: '케이크', emoji: '🎂', tone: 'from-rose-100 to-amber-100' },
    ];
    const pickVisual = (name = '') =>
      PRODUCT_VISUALS.find((v) => name.includes(v.kw)) || { emoji: '🧁', tone: 'from-rose-100 to-amber-100' };

    function ProductImage({ src, alt, className = '' }) {
      const [failed, setFailed] = useState(false);
      const { emoji, tone } = pickVisual(alt);
      if (failed || !src) {
        return (
          <div className={`flex items-center justify-center bg-gradient-to-br ${tone} ${className}`}>
            <span className="text-5xl" role="img" aria-label={alt}>{emoji}</span>
          </div>
        );
      }
      return <img src={src} alt={alt} loading="lazy" onError={() => setFailed(true)} className={`object-cover ${className}`} />;
    }

    // ========================================
    // 🔐 Auth Context (세션 유지)
    // ========================================
    const AuthContext = createContext(null);
    const useAuth = () => useContext(AuthContext);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        sb.auth.getSession().then(({ data }) => {
          setUser(data.session?.user ?? null);
          setReady(true);
        });
        const { data: sub } = sb.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      const value = { user, ready };
      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }

    // ========================================
    // 🔑 인증 모달 (회원가입 / 로그인)
    // ========================================
    function AuthModal({ isOpen, onClose }) {
      const [mode, setMode] = useState('login'); // 'login' | 'signup'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [notice, setNotice] = useState('');

      const reset = () => { setEmail(''); setPassword(''); setError(''); setNotice(''); };

      const close = () => { reset(); onClose(); };

      const submit = async (e) => {
        e.preventDefault();
        setError(''); setNotice('');
        if (!email || !password) { setError('이메일과 비밀번호를 입력해 주세요.'); return; }
        if (mode === 'signup' && password.length < 6) { setError('비밀번호는 6자 이상이어야 해요.'); return; }
        setLoading(true);
        try {
          if (mode === 'signup') {
            const { data, error } = await sb.auth.signUp({ email, password });
            if (error) throw error;
            if (!data.session) {
              // 이메일 확인이 켜진 경우: 세션이 없으면 확인 메일 안내
              setNotice('확인 메일을 보냈어요. 메일함에서 인증 후 로그인해 주세요. 📧');
            } else {
              close(); // 자동 로그인됨
            }
          } else {
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
            close();
          }
        } catch (err) {
          setError(translateAuthError(err.message));
        } finally {
          setLoading(false);
        }
      };

      const switchMode = (m) => { setMode(m); setError(''); setNotice(''); };

      return (
        <Modal isOpen={isOpen} onClose={close} title={mode === 'login' ? '로그인' : '회원가입'} size="sm">
          <div className="flex mb-5 p-1 bg-stone-100 rounded-xl">
            <button onClick={() => switchMode('login')}
              className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${mode === 'login' ? 'bg-white shadow-sm text-rose-600' : 'text-stone-500'}`}>로그인</button>
            <button onClick={() => switchMode('signup')}
              className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${mode === 'signup' ? 'bg-white shadow-sm text-rose-600' : 'text-stone-500'}`}>회원가입</button>
          </div>
          <form onSubmit={submit} className="space-y-3">
            <Input label="이메일" type="email" value={email} onChange={(e) => setEmail(e.target.value)}
              placeholder="you@example.com" autoComplete="email" />
            <Input label="비밀번호" type="password" value={password} onChange={(e) => setPassword(e.target.value)}
              placeholder="6자 이상" autoComplete={mode === 'login' ? 'current-password' : 'new-password'} />
            {error && <p className="text-sm text-red-500 bg-red-50 rounded-lg px-3 py-2">{error}</p>}
            {notice && <p className="text-sm text-emerald-600 bg-emerald-50 rounded-lg px-3 py-2">{notice}</p>}
            <Button type="submit" size="lg" disabled={loading} className="w-full">
              {loading ? <Spinner /> : (mode === 'login' ? '로그인' : '가입하기')}
            </Button>
          </form>
        </Modal>
      );
    }

    function translateAuthError(msg = '') {
      if (/Invalid login credentials/i.test(msg)) return '이메일 또는 비밀번호가 올바르지 않아요.';
      if (/already registered|already exists/i.test(msg)) return '이미 가입된 이메일이에요. 로그인해 주세요.';
      if (/Email not confirmed/i.test(msg)) return '이메일 인증이 필요해요. 메일함을 확인해 주세요.';
      if (/rate limit/i.test(msg)) return '요청이 많아요. 잠시 후 다시 시도해 주세요.';
      return msg || '문제가 발생했어요. 다시 시도해 주세요.';
    }

    // ========================================
    // 🧩 Header (로고 · 유저 · 장바구니)
    // ========================================
    function Header({ user, cartCount, onOpenAuth, onLogout, onOpenCart }) {
      return (
        <header className="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-stone-100">
          <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-2xl" role="img" aria-label="컵케이크">🧁</span>
              <h1 className="text-lg sm:text-xl font-extrabold tracking-tight text-stone-800">Sweet Spot</h1>
            </div>
            <div className="flex items-center gap-2 sm:gap-3">
              {user ? (
                <>
                  <span className="hidden sm:inline text-sm text-stone-500 max-w-[160px] truncate">{user.email}</span>
                  <Button variant="ghost" size="sm" onClick={onLogout}>로그아웃</Button>
                </>
              ) : (
                <Button variant="secondary" size="sm" onClick={onOpenAuth}>로그인</Button>
              )}
              <button onClick={onOpenCart} aria-label="장바구니"
                className="relative p-2.5 rounded-xl hover:bg-stone-100 transition">
                <span className="text-xl" role="img" aria-hidden="true">🛒</span>
                {cartCount > 0 && (
                  <span className="absolute -top-0.5 -right-0.5 min-w-[20px] h-5 px-1 flex items-center justify-center text-[11px] font-bold text-white bg-rose-500 rounded-full">
                    {cartCount}
                  </span>
                )}
              </button>
            </div>
          </div>
        </header>
      );
    }

    // ========================================
    // 🔎 필터 바 (카테고리 · 검색)
    // ========================================
    function FilterBar({ categories, active, onSelect, query, onQuery }) {
      return (
        <div className="space-y-4 mb-6">
          <div className="relative max-w-md">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400">🔍</span>
            <input value={query} onChange={(e) => onQuery(e.target.value)} placeholder="먹고 싶은 디저트를 검색해 보세요"
              className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-stone-200 bg-white focus:outline-none focus:ring-2 focus:ring-rose-200 focus:border-rose-300" />
          </div>
          <div className="flex flex-wrap gap-2">
            {categories.map((c) => (
              <button key={c} onClick={() => onSelect(c)}
                className={`px-4 py-1.5 text-sm font-semibold rounded-full border transition
                  ${active === c ? 'bg-rose-500 text-white border-rose-500' : 'bg-white text-stone-600 border-stone-200 hover:border-rose-300'}`}>
                {c}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ========================================
    // 🍰 상품 카드 & 그리드
    // ========================================
    function ProductCard({ product, onAdd, adding }) {
      return (
        <Card className="overflow-hidden flex flex-col group animate-fade-in">
          <div className="relative">
            <ProductImage src={product.image_url} alt={product.name} className="w-full h-44 group-hover:scale-105 transition duration-300" />
            {product.category && (
              <Badge className="absolute top-3 left-3 bg-white/90 text-rose-600 backdrop-blur">{product.category}</Badge>
            )}
          </div>
          <div className="p-4 flex flex-col flex-1">
            <h3 className="font-bold text-stone-800">{product.name}</h3>
            <p className="mt-1 text-sm text-stone-500 line-clamp-2 flex-1">{product.description || '맛있는 디저트예요.'}</p>
            <div className="mt-3 flex items-center justify-between">
              <span className="text-lg font-extrabold text-stone-800">{won(product.price)}</span>
              <Button size="sm" onClick={() => onAdd(product)} disabled={adding}>
                {adding ? <Spinner className="h-4 w-4" /> : '담기'}
              </Button>
            </div>
          </div>
        </Card>
      );
    }

    function ProductGrid({ products, onAdd, addingId }) {
      if (products.length === 0) {
        return (
          <div className="text-center py-20 text-stone-400">
            <div className="text-5xl mb-3">🔎</div>
            <p>조건에 맞는 디저트가 없어요.</p>
          </div>
        );
      }
      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
          {products.map((p) => (
            <ProductCard key={p.id} product={p} onAdd={onAdd} adding={addingId === p.id} />
          ))}
        </div>
      );
    }

    // ========================================
    // 🚚 무료배송 게이지
    // ========================================
    function FreeShippingGauge({ total }) {
      const reached = total >= FREE_SHIPPING_THRESHOLD;
      const pct = Math.min(100, Math.round((total / FREE_SHIPPING_THRESHOLD) * 100));
      const remain = FREE_SHIPPING_THRESHOLD - total;
      return (
        <div className="px-4 py-3 bg-rose-50 rounded-xl">
          <p className="text-sm font-medium mb-2">
            {reached ? (
              <span className="text-emerald-600 font-bold">🎉 무료배송 적용!</span>
            ) : (
              <span className="text-stone-600">무료배송까지 <span className="font-bold text-rose-600">{won(remain)}</span> 남았어요</span>
            )}
          </p>
          <div className="h-2.5 rounded-full bg-white overflow-hidden">
            <div className={`h-full rounded-full transition-all duration-500 ${reached ? 'bg-emerald-400' : 'bg-rose-400'}`}
              style={{ width: pct + '%' }} />
          </div>
        </div>
      );
    }

    // ========================================
    // 🛒 장바구니 패널
    // ========================================
    function CartItemRow({ item, onQty, onRemove, busy }) {
      const p = item.product;
      const sub = (p?.price ?? 0) * item.quantity;
      return (
        <div className="flex gap-3 py-3">
          <ProductImage src={p?.image_url} alt={p?.name} className="w-16 h-16 rounded-xl flex-shrink-0" />
          <div className="flex-1 min-w-0">
            <p className="font-semibold text-stone-800 truncate">{p?.name || '삭제된 상품'}</p>
            <p className="text-sm text-stone-500">{won(p?.price)}</p>
            <div className="mt-1.5 flex items-center gap-2">
              <button onClick={() => onQty(item, item.quantity - 1)} disabled={busy}
                className="w-7 h-7 rounded-lg border border-stone-200 hover:bg-stone-50 font-bold text-stone-600 disabled:opacity-40" aria-label="수량 감소">−</button>
              <span className="w-6 text-center text-sm font-semibold">{item.quantity}</span>
              <button onClick={() => onQty(item, item.quantity + 1)} disabled={busy}
                className="w-7 h-7 rounded-lg border border-stone-200 hover:bg-stone-50 font-bold text-stone-600 disabled:opacity-40" aria-label="수량 증가">+</button>
            </div>
          </div>
          <div className="text-right flex flex-col justify-between items-end">
            <span className="font-bold text-stone-800">{won(sub)}</span>
            <button onClick={() => onRemove(item)} disabled={busy} className="text-xs text-stone-400 hover:text-red-500">삭제</button>
          </div>
        </div>
      );
    }

    function CartPanel({ isOpen, onClose, user, items, loading, error, onQty, onRemove, busyId, onCheckout }) {
      const total = useMemo(() => items.reduce((s, it) => s + (it.product?.price ?? 0) * it.quantity, 0), [items]);

      return (
        <div className={`fixed inset-0 z-40 ${isOpen ? '' : 'pointer-events-none'}`} aria-hidden={!isOpen}>
          <div className={`absolute inset-0 bg-stone-900/40 transition-opacity ${isOpen ? 'opacity-100' : 'opacity-0'}`} onClick={onClose} />
          <aside className={`absolute right-0 top-0 h-full w-full max-w-md bg-stone-50 shadow-2xl flex flex-col transition-transform duration-300 ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="flex items-center justify-between px-5 h-16 border-b border-stone-200 bg-white flex-shrink-0">
              <h2 className="font-bold text-lg">🛒 장바구니</h2>
              <button onClick={onClose} className="text-stone-400 hover:text-stone-600 text-2xl" aria-label="닫기">×</button>
            </div>

            <div className="flex-1 overflow-y-auto px-5">
              {!user ? (
                <EmptyHint emoji="🔒" text="로그인하면 장바구니를 사용할 수 있어요." />
              ) : loading ? (
                <div className="flex justify-center py-20 text-rose-400"><Spinner className="h-7 w-7" /></div>
              ) : error ? (
                <EmptyHint emoji="⚠️" text={error} />
              ) : items.length === 0 ? (
                <EmptyHint emoji="🛒" text="장바구니가 비어 있어요. 마음에 드는 디저트를 담아보세요!" />
              ) : (
                <div className="divide-y divide-stone-100">
                  {items.map((it) => (
                    <CartItemRow key={it.id} item={it} onQty={onQty} onRemove={onRemove} busy={busyId === it.id} />
                  ))}
                </div>
              )}
            </div>

            {user && items.length > 0 && (
              <div className="border-t border-stone-200 bg-white p-5 space-y-3 flex-shrink-0">
                <FreeShippingGauge total={total} />
                <div className="flex items-center justify-between text-lg">
                  <span className="font-semibold text-stone-600">합계</span>
                  <span className="font-extrabold text-stone-900">{won(total)}</span>
                </div>
                <Button size="lg" className="w-full" onClick={onCheckout}>주문하기</Button>
              </div>
            )}
          </aside>
        </div>
      );
    }

    function EmptyHint({ emoji, text }) {
      return (
        <div className="text-center py-20 text-stone-400">
          <div className="text-5xl mb-3">{emoji}</div>
          <p className="px-6">{text}</p>
        </div>
      );
    }

    // ========================================
    // 📄 Shop Page (메인 로직)
    // ========================================
    function ShopPage() {
      const { user, ready } = useAuth();

      // 상품 상태
      const [products, setProducts] = useState([]);
      const [prodLoading, setProdLoading] = useState(true);
      const [prodError, setProdError] = useState('');

      // 필터
      const [category, setCategory] = useState('전체');
      const [query, setQuery] = useState('');

      // 장바구니 상태
      const [cart, setCart] = useState([]);
      const [cartLoading, setCartLoading] = useState(false);
      const [cartError, setCartError] = useState('');

      // UI 상태
      const [authOpen, setAuthOpen] = useState(false);
      const [cartOpen, setCartOpen] = useState(false);
      const [addingId, setAddingId] = useState(null);
      const [busyId, setBusyId] = useState(null);

      // --- 상품 불러오기 (비로그인 포함 누구나) ---
      useEffect(() => {
        let alive = true;
        (async () => {
          setProdLoading(true); setProdError('');
          const { data, error } = await sb.from('shop_products').select('*').order('created_at', { ascending: true });
          if (!alive) return;
          if (error) setProdError('상품을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
          else setProducts(data || []);
          setProdLoading(false);
        })();
        return () => { alive = false; };
      }, []);

      // --- 장바구니 불러오기 (로그인 시) ---
      const loadCart = useCallback(async () => {
        if (!user) { setCart([]); return; }
        setCartLoading(true); setCartError('');
        const { data, error } = await sb.from('shop_cart').select('*').order('created_at', { ascending: true });
        if (error) { setCartError('장바구니를 불러오지 못했어요.'); setCartLoading(false); return; }
        setCart(data || []);
        setCartLoading(false);
      }, [user]);

      useEffect(() => { loadCart(); }, [loadCart]);

      // 상품 정보를 장바구니 항목에 결합 (product_id <-> products.id)
      const productMap = useMemo(() => {
        const m = {};
        products.forEach((p) => { m[p.id] = p; });
        return m;
      }, [products]);

      const cartItems = useMemo(
        () => cart.map((c) => ({ ...c, product: productMap[c.product_id] })),
        [cart, productMap]
      );

      const cartCount = useMemo(() => cart.reduce((s, c) => s + c.quantity, 0), [cart]);

      // --- 카테고리 동적 생성 (distinct) ---
      const categories = useMemo(() => {
        const set = new Set(products.map((p) => p.category).filter(Boolean));
        return ['전체', ...Array.from(set)];
      }, [products]);

      // --- 필터링 ---
      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return products.filter((p) => {
          const okCat = category === '전체' || p.category === category;
          const okQ = !q || (p.name || '').toLowerCase().includes(q);
          return okCat && okQ;
        });
      }, [products, category, query]);

      // --- 담기 (upsert: 있으면 수량+1) ---
      const handleAdd = async (product) => {
        if (!user) { setAuthOpen(true); return; }
        setAddingId(product.id);
        try {
          const existing = cart.find((c) => c.product_id === product.id);
          if (existing) {
            const { data, error } = await sb.from('shop_cart')
              .update({ quantity: existing.quantity + 1 })
              .eq('id', existing.id).select().single();
            if (error) throw error;
            setCart((prev) => prev.map((c) => (c.id === data.id ? data : c)));
          } else {
            const { data, error } = await sb.from('shop_cart')
              .insert({ product_id: product.id, quantity: 1 }).select().single();
            if (error) throw error;
            setCart((prev) => [...prev, data]);
          }
          setCartOpen(true);
        } catch (err) {
          alert('담는 중 문제가 발생했어요: ' + translateAuthError(err.message));
        } finally {
          setAddingId(null);
        }
      };

      // --- 수량 변경 (0 이하면 삭제) ---
      const handleQty = async (item, nextQty) => {
        if (nextQty < 1) { return handleRemove(item); }
        setBusyId(item.id);
        try {
          const { data, error } = await sb.from('shop_cart')
            .update({ quantity: nextQty }).eq('id', item.id).select().single();
          if (error) throw error;
          setCart((prev) => prev.map((c) => (c.id === data.id ? data : c)));
        } catch (err) {
          alert('수량 변경 실패: ' + translateAuthError(err.message));
        } finally {
          setBusyId(null);
        }
      };

      // --- 삭제 ---
      const handleRemove = async (item) => {
        setBusyId(item.id);
        try {
          const { error } = await sb.from('shop_cart').delete().eq('id', item.id);
          if (error) throw error;
          setCart((prev) => prev.filter((c) => c.id !== item.id));
        } catch (err) {
          alert('삭제 실패: ' + translateAuthError(err.message));
        } finally {
          setBusyId(null);
        }
      };

      const handleLogout = async () => {
        await sb.auth.signOut();
        setCart([]);
        setCartOpen(false);
      };

      const handleCheckout = () => {
        alert('결제 기능은 준비 중이에요. 조금만 기다려 주세요! 🧁');
      };

      return (
        <div className="min-h-screen flex flex-col">
          <Header user={user} cartCount={cartCount}
            onOpenAuth={() => setAuthOpen(true)} onLogout={handleLogout} onOpenCart={() => setCartOpen(true)} />

          {/* Hero */}
          <section className="bg-gradient-to-br from-rose-100 via-amber-50 to-rose-50 border-b border-stone-100">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14 text-center">
              <h2 className="text-2xl sm:text-4xl font-extrabold text-stone-800">달콤한 하루, Sweet Spot 🧁</h2>
              <p className="mt-3 text-stone-500 text-sm sm:text-base">매일 굽는 신선한 디저트 · 30,000원 이상 무료배송</p>
            </div>
          </section>

          <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
            {prodLoading ? (
              <div className="flex justify-center py-24 text-rose-400"><Spinner className="h-8 w-8" /></div>
            ) : prodError ? (
              <EmptyHint emoji="⚠️" text={prodError} />
            ) : (
              <>
                <FilterBar categories={categories} active={category} onSelect={setCategory} query={query} onQuery={setQuery} />
                <ProductGrid products={filtered} onAdd={handleAdd} addingId={addingId} />
              </>
            )}
          </main>

          <footer className="border-t border-stone-100 py-8 text-center text-sm text-stone-400">
            <p>🧁 Sweet Spot · 디저트 샵 — supabase-js Auth + DB 데모 (결제 기능 제외)</p>
          </footer>

          <CartPanel isOpen={cartOpen} onClose={() => setCartOpen(false)} user={user}
            items={cartItems} loading={cartLoading} error={cartError}
            onQty={handleQty} onRemove={handleRemove} busyId={busyId} onCheckout={handleCheckout} />

          <AuthModal isOpen={authOpen} onClose={() => setAuthOpen(false)} />
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <AuthProvider>
          <ShopPage />
        </AuthProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
