<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 카페를 아는 AI 에이전트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.35s ease-out; }
    body { background: #faf7f2; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ========================================
    // ⚙️ 설정 (Supabase / 카페 컨텍스트)
    // ========================================
    const SUPABASE_URL = 'https://ibxhnwovdtnfttfzqpos.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7RB2j_pC9YcoPG5N1n8uZg_p12ndXjr';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // my_cafe.md 요약 — 에이전트가 답변에 활용하는 컨텍스트
    const CAFE_CONTEXT = {
      name: '하버스카페',
      location: '성수동 골목',
      concept: '작업/휴식 카페',
      target: '20~30대 직장인·디자이너 (작업하러 오래 머무는 손님)',
      signature: '흑임자 라떼 + 바스크 치즈케이크',
      diff: '"작업 카페 + 흑임자 시그니처"',
      constraints: [
        '마케팅 예산 월 50만 원',
        '좌석 24석',
        '주방 인력 2명',
        '디저트 당일 생산만',
      ],
    };

    const WON = (n) => (n ?? 0).toLocaleString('ko-KR') + '원';
    const DAYS = ['일', '월', '화', '수', '목', '금', '토'];

    // ========================================
    // 🎨 디자인 시스템 컴포넌트
    // ========================================
    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-stone-200/70 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, color = 'stone' }) {
      const map = {
        stone: 'bg-stone-100 text-stone-600',
        amber: 'bg-amber-100 text-amber-700',
        rose: 'bg-rose-100 text-rose-700',
        emerald: 'bg-emerald-100 text-emerald-700',
      };
      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold ${map[color]}`}>
          {children}
        </span>
      );
    }

    function Spinner({ label = '불러오는 중...' }) {
      return (
        <div className="flex flex-col items-center justify-center gap-3 py-16 text-stone-400">
          <div className="w-8 h-8 border-4 border-stone-200 border-t-amber-500 rounded-full animate-spin" />
          <p className="text-sm">{label}</p>
        </div>
      );
    }

    function ErrorBox({ message, onRetry }) {
      return (
        <div className="bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-6 text-center">
          <p className="font-semibold mb-1">데이터를 불러오지 못했어요</p>
          <p className="text-sm text-rose-500 mb-4">{message}</p>
          {onRetry && (
            <button onClick={onRetry} className="px-4 py-2 bg-rose-600 text-white rounded-lg text-sm font-semibold hover:bg-rose-700">
              다시 시도
            </button>
          )}
        </div>
      );
    }

    // ========================================
    // 🧩 컨텍스트 카드 (my_cafe.md 접기/펴기)
    // ========================================
    function ContextCard() {
      const [open, setOpen] = useState(false);
      const c = CAFE_CONTEXT;
      return (
        <Card className="overflow-hidden">
          <button
            onClick={() => setOpen((v) => !v)}
            className="w-full flex items-center justify-between px-5 py-4 text-left hover:bg-stone-50 transition"
            aria-expanded={open}
          >
            <div className="flex items-center gap-2">
              <span className="text-lg">📄</span>
              <span className="font-semibold text-stone-800">my_cafe.md — 에이전트가 아는 내 카페</span>
            </div>
            <span className={`text-stone-400 transition-transform ${open ? 'rotate-180' : ''}`}>▾</span>
          </button>
          {open && (
            <div className="px-5 pb-5 pt-1 text-sm text-stone-600 space-y-2 animate-fadeIn border-t border-stone-100">
              <Row k="가게명" v={c.name} />
              <Row k="위치 / 콘셉트" v={`${c.location} · ${c.concept}`} />
              <Row k="타겟" v={c.target} />
              <Row k="시그니처" v={c.signature} />
              <Row k="차별점" v={c.diff} />
              <div className="pt-1">
                <span className="text-stone-400 text-xs">제약 조건</span>
                <div className="flex flex-wrap gap-1.5 mt-1">
                  {c.constraints.map((x) => <Badge key={x} color="amber">{x}</Badge>)}
                </div>
              </div>
            </div>
          )}
        </Card>
      );
    }
    function Row({ k, v }) {
      return (
        <div className="flex gap-3">
          <span className="text-stone-400 text-xs w-24 shrink-0 pt-0.5">{k}</span>
          <span className="text-stone-700">{v}</span>
        </div>
      );
    }

    // ========================================
    // 🧩 대시보드 (DB 집계)
    // ========================================
    function StatTile({ label, value, sub }) {
      return (
        <Card className="p-4">
          <p className="text-xs text-stone-400 mb-1">{label}</p>
          <p className="text-xl font-bold text-stone-800">{value}</p>
          {sub && <p className="text-xs text-stone-400 mt-1">{sub}</p>}
        </Card>
      );
    }

    function Dashboard({ stats }) {
      const maxMenu = Math.max(...stats.menuTop3.map((m) => m.amount), 1);
      const maxDay = Math.max(...stats.byDay.map((d) => d.revenue), 1);
      return (
        <section className="space-y-4">
          <h2 className="text-lg font-bold text-stone-800 flex items-center gap-2">
            📊 대시보드 <span className="text-xs font-normal text-stone-400">DB 실시간 집계</span>
          </h2>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <StatTile label="총 매출" value={WON(stats.totalRevenue)} sub={`누적 손님 ${stats.totalCustomers.toLocaleString('ko-KR')}명`} />
            <StatTile label="리뷰 평균 별점" value={`★ ${stats.avgRating.toFixed(2)}`} sub={`리뷰 ${stats.reviewCount}건`} />
            <StatTile label="가장 한산한 요일" value={`${stats.lowDay.day}요일`} sub={WON(stats.lowDay.revenue)} />
            <StatTile label="부정 리뷰 1위 테마" value={stats.negTheme.theme} sub={`별점 2이하 · ${stats.negTheme.count}건`} />
          </div>

          <div className="grid md:grid-cols-2 gap-4">
            {/* 메뉴별 매출 TOP3 */}
            <Card className="p-5">
              <h3 className="font-semibold text-stone-700 mb-4">메뉴별 매출 TOP3</h3>
              <div className="space-y-3">
                {stats.menuTop3.map((m, i) => (
                  <div key={m.menu}>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="text-stone-600">
                        <span className="font-bold text-amber-600 mr-1">{i + 1}</span>{m.menu}
                      </span>
                      <span className="font-semibold text-stone-800">{WON(m.amount)}</span>
                    </div>
                    <div className="h-2 bg-stone-100 rounded-full overflow-hidden">
                      <div className="h-full bg-amber-400 rounded-full" style={{ width: `${(m.amount / maxMenu) * 100}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            </Card>

            {/* 요일별 매출 */}
            <Card className="p-5">
              <h3 className="font-semibold text-stone-700 mb-4">요일별 매출 <span className="text-xs text-stone-400 font-normal">(가장 한산한 요일 강조)</span></h3>
              <div className="flex items-end justify-between gap-2 h-36">
                {stats.byDay.map((d) => {
                  const isLow = d.day === stats.lowDay.day;
                  return (
                    <div key={d.day} className="flex-1 flex flex-col items-center justify-end gap-1 h-full">
                      <div
                        className={`w-full rounded-t-md transition-all ${isLow ? 'bg-rose-400' : 'bg-stone-300'}`}
                        style={{ height: `${Math.max((d.revenue / maxDay) * 100, 4)}%` }}
                        title={WON(d.revenue)}
                      />
                      <span className={`text-xs ${isLow ? 'text-rose-600 font-bold' : 'text-stone-400'}`}>{d.day}</span>
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>
        </section>
      );
    }

    // ========================================
    // 🧩 Before / After Q&A (핵심)
    // ========================================
    function buildQA(stats) {
      const heukimja = stats.menuByName.find((m) => m.menu.includes('흑임자'));
      const heukimjaAmt = heukimja ? heukimja.amount : 0;
      return [
        {
          q: '신메뉴 뭐 추가할까?',
          off: '요즘 유행하는 딸기 라떼나 크로플 추천드려요.',
          on: `흑임자 라떼가 매출 1위(${WON(heukimjaAmt)})예요. '흑임자 티라미수'로 시그니처를 넓혀보세요. 작업하러 오래 머무는 손님이 많으니 콜드브루 변형도 좋아요. 단 주방 2명·당일생산 제약이 있으니 공정 단순한 메뉴로.`,
        },
        {
          q: '어느 요일에 프로모션 돌릴까?',
          off: '보통 주말 할인이 효과적이에요.',
          on: `요일별 매출을 보면 ${stats.lowDay.day}요일이 가장 한산해요. 한산한 평일에 '작업러 타임' 디저트 세트 할인으로 회전 낮은 시간을 채우는 게 좋아요.`,
        },
        {
          q: '리뷰 개선 우선순위는?',
          off: '전반적으로 서비스 품질을 높이세요.',
          on: `부정 리뷰 1위 테마가 '${stats.negTheme.theme}'예요. 차별점이 '오래 머무는 작업 카페'라 회전이 느린 점과 맞물려요. 피크 시간 모바일주문/픽업 동선 개선이 1순위.`,
        },
        {
          q: '객단가 올리려면?',
          off: '세트 메뉴나 사이드를 늘리세요.',
          on: `흑임자 라떼 + 바스크 치즈케이크 페어링 세트로 시그니처 2개를 묶으면 객단가가 올라가요. 마케팅 예산 50만 안에서 인스타로 '흑임자 세트'를 밀면 인지도 약점도 같이 보완돼요.`,
        },
      ];
    }

    function AnswerCard({ kind, text }) {
      const off = kind === 'off';
      return (
        <div
          className={`rounded-2xl p-5 border animate-fadeIn ${
            off ? 'bg-stone-50 border-stone-200' : 'bg-amber-50 border-amber-300 ring-1 ring-amber-200'
          }`}
        >
          <div className="flex items-center gap-2 mb-3">
            <span className="text-lg">{off ? '🤖' : '🎯'}</span>
            <span className={`text-sm font-bold ${off ? 'text-stone-500' : 'text-amber-700'}`}>
              {off ? '컨텍스트 없는 일반 AI' : '내 카페 에이전트'}
            </span>
            {off
              ? <Badge color="stone">일반 답변</Badge>
              : <Badge color="amber">my_cafe.md + DB</Badge>}
          </div>
          <p className={`text-sm leading-relaxed ${off ? 'text-stone-500' : 'text-stone-800'}`}>{text}</p>
        </div>
      );
    }

    function QASection({ stats }) {
      const qa = useMemo(() => buildQA(stats), [stats]);
      const [active, setActive] = useState(0);
      const cur = qa[active];

      return (
        <section className="space-y-4">
          <h2 className="text-lg font-bold text-stone-800 flex items-center gap-2">
            💬 Before / After 비교
            <span className="text-xs font-normal text-stone-400">같은 질문, 다른 답</span>
          </h2>

          {/* 추천 질문 칩 */}
          <div className="flex flex-wrap gap-2">
            {qa.map((item, i) => (
              <button
                key={i}
                onClick={() => setActive(i)}
                className={`px-4 py-2 rounded-full text-sm font-medium transition border ${
                  active === i
                    ? 'bg-amber-500 text-white border-amber-500 shadow-sm'
                    : 'bg-white text-stone-600 border-stone-200 hover:border-amber-300 hover:text-amber-600'
                }`}
              >
                {item.q}
              </button>
            ))}
          </div>

          {/* 질문 */}
          <Card className="p-4 flex items-center gap-3">
            <span className="text-xl">🙋</span>
            <p className="font-semibold text-stone-800">{cur.q}</p>
          </Card>

          {/* Before / After 나란히 */}
          <div className="grid md:grid-cols-2 gap-4">
            <AnswerCard key={`off-${active}`} kind="off" text={cur.off} />
            <AnswerCard key={`on-${active}`} kind="on" text={cur.on} />
          </div>
        </section>
      );
    }

    // ========================================
    // 📡 데이터 로딩 + 집계
    // ========================================
    function aggregate(sales, menuSales, reviews) {
      // 총매출 / 손님
      const totalRevenue = sales.reduce((s, r) => s + (r.revenue || 0), 0);
      const totalCustomers = sales.reduce((s, r) => s + (r.customers || 0), 0);

      // 메뉴별 매출
      const menuMap = {};
      menuSales.forEach((r) => {
        menuMap[r.menu] = (menuMap[r.menu] || 0) + (r.amount || 0);
      });
      const menuByName = Object.entries(menuMap)
        .map(([menu, amount]) => ({ menu, amount }))
        .sort((a, b) => b.amount - a.amount);
      const menuTop3 = menuByName.slice(0, 3);

      // 요일별 매출
      const dayMap = {};
      sales.forEach((r) => {
        const d = DAYS[new Date(r.date).getDay()];
        dayMap[d] = (dayMap[d] || 0) + (r.revenue || 0);
      });
      const byDay = DAYS.map((day) => ({ day, revenue: dayMap[day] || 0 }));
      const lowDay = byDay
        .filter((d) => d.revenue > 0)
        .sort((a, b) => a.revenue - b.revenue)[0] || byDay[0];

      // 리뷰 평균 별점
      const reviewCount = reviews.length;
      const avgRating = reviewCount
        ? reviews.reduce((s, r) => s + (r.rating || 0), 0) / reviewCount
        : 0;

      // 부정 리뷰(별점 2이하) 테마 1위
      const negMap = {};
      reviews
        .filter((r) => (r.rating || 0) <= 2 && r.theme)
        .forEach((r) => { negMap[r.theme] = (negMap[r.theme] || 0) + 1; });
      const negSorted = Object.entries(negMap)
        .map(([theme, count]) => ({ theme, count }))
        .sort((a, b) => b.count - a.count);
      const negTheme = negSorted[0] || { theme: '없음', count: 0 };

      return {
        totalRevenue, totalCustomers,
        menuByName, menuTop3,
        byDay, lowDay,
        reviewCount, avgRating,
        negTheme,
      };
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const load = async () => {
        setLoading(true);
        setError(null);
        try {
          const [s, m, r] = await Promise.all([
            sb.from('cafe_sales').select('date, revenue, customers'),
            sb.from('cafe_menu_sales').select('date, menu, qty, amount'),
            sb.from('cafe_reviews').select('date, platform, rating, review, theme'),
          ]);
          if (s.error) throw s.error;
          if (m.error) throw m.error;
          if (r.error) throw r.error;
          setStats(aggregate(s.data || [], m.data || [], r.data || []));
        } catch (e) {
          setError(e.message || '알 수 없는 오류');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { load(); }, []);

      return (
        <div className="min-h-screen text-stone-800">
          <div className="max-w-5xl mx-auto px-4 py-8 space-y-6">
            {/* 헤더 */}
            <header className="space-y-1">
              <div className="flex items-center gap-2">
                <span className="text-2xl">☕</span>
                <h1 className="text-2xl font-extrabold tracking-tight">내 카페를 아는 AI 에이전트</h1>
              </div>
              <p className="text-sm text-stone-500">
                같은 질문에 대해 <b className="text-stone-600">컨텍스트 없는 AI</b> vs
                <b className="text-amber-600"> my_cafe.md + DB를 아는 에이전트</b>를 비교해보세요.
              </p>
            </header>

            <ContextCard />

            {loading && <Spinner label="DB에서 카페 데이터를 집계하는 중..." />}
            {error && <ErrorBox message={error} onRetry={load} />}

            {!loading && !error && stats && (
              <>
                <Dashboard stats={stats} />
                <QASection stats={stats} />
              </>
            )}

            <footer className="pt-4 text-center text-xs text-stone-400">
              데이터: Supabase (cafe_sales · cafe_menu_sales · cafe_reviews) · 읽기 전용 집계
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
