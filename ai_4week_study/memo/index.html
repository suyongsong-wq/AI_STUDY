<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하버스쿨 AI 교육 · 메모장 (DB 연동)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background:#0f172a; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
    .fade-in { animation: fadeIn .15s ease; }
    ::-webkit-scrollbar { width:8px; }
    ::-webkit-scrollbar-thumb { background:#334155; border-radius:8px; }
  </style>
</head>
<body class="text-slate-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 우리 서버의 API 호출 (서버가 다시 Supabase Postgres DB에 저장)
    const api = {
      list:   ()              => fetch("/api/memos").then(r => r.json()),
      search: (q)             => fetch("/api/memos?q=" + encodeURIComponent(q)).then(r => r.json()),
      add:    (title, content)=> fetch("/api/memos", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ title, content }) }),
      update: (id, title, content) => fetch("/api/memos/" + id, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ title, content }) }),
      remove: (id)            => fetch("/api/memos/" + id, { method:"DELETE" }),
    };

    // 작성시각을 한국 로캘로 예쁘게
    function fmt(ts) {
      try {
        return new Date(ts).toLocaleString("ko-KR", {
          year:"numeric", month:"long", day:"numeric", hour:"2-digit", minute:"2-digit",
        });
      } catch { return ts; }
    }

    // 메모 카드 (보기 모드 / 편집 모드)
    function MemoCard({ memo, onUpdate, onDelete }) {
      const [editing, setEditing] = useState(false);
      const [title, setTitle] = useState(memo.title);
      const [content, setContent] = useState(memo.content);

      function startEdit() { setTitle(memo.title); setContent(memo.content); setEditing(true); }
      async function save() {
        if (!title.trim()) return;
        await onUpdate(memo.id, title.trim(), content.trim());
        setEditing(false);
      }

      if (editing) {
        return (
          <li className="fade-in bg-slate-800 border border-sky-500/50 rounded-xl px-4 py-3 space-y-2">
            <input value={title} onChange={(e)=>setTitle(e.target.value)} maxLength={100}
              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 outline-none focus:border-sky-400" />
            <textarea value={content} onChange={(e)=>setContent(e.target.value)} rows={3}
              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 outline-none focus:border-sky-400 resize-y" />
            <div className="flex justify-end gap-2 text-sm">
              <button onClick={()=>setEditing(false)} className="px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300 hover:border-slate-400">취소</button>
              <button onClick={save} className="px-3 py-1.5 rounded-lg bg-sky-400 text-slate-900 font-bold hover:opacity-90">저장</button>
            </div>
          </li>
        );
      }

      return (
        <li className="fade-in bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
          <div className="flex items-start justify-between gap-3">
            <h3 className="font-bold text-lg break-all flex-1">{memo.title}</h3>
            <div className="flex gap-2 text-sm flex-shrink-0">
              <button onClick={startEdit} className="text-slate-400 hover:text-sky-400">수정</button>
              <button onClick={()=>onDelete(memo)} className="text-slate-400 hover:text-red-500">삭제</button>
            </div>
          </div>
          {memo.content && <p className="mt-1.5 text-slate-300 whitespace-pre-wrap break-all">{memo.content}</p>}
          <p className="mt-2 text-xs text-slate-500">{fmt(memo.created_at)}</p>
        </li>
      );
    }

    function App() {
      const [memos, setMemos] = useState([]);
      const [title, setTitle] = useState("");
      const [content, setContent] = useState("");
      const [q, setQ] = useState("");
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      async function load(keyword) {
        try {
          const data = keyword && keyword.trim() ? await api.search(keyword.trim()) : await api.list();
          if (Array.isArray(data)) { setMemos(data); setError(""); }
          else setError(data.error || "불러오기 실패");
        } catch (e) {
          setError("서버에 연결할 수 없습니다. node server.js 실행 여부를 확인하세요.");
        }
        setLoading(false);
      }
      useEffect(() => { load(""); }, []);

      // 검색어 입력 → 400ms 디바운스로 서버 검색
      useEffect(() => {
        const t = setTimeout(() => load(q), 400);
        return () => clearTimeout(t);
      }, [q]);

      async function addMemo() {
        if (!title.trim()) return;
        await api.add(title.trim(), content.trim());
        setTitle(""); setContent("");
        load(q);
      }
      async function updateMemo(id, t, c) { await api.update(id, t, c); load(q); }
      async function deleteMemo(memo) {
        if (!window.confirm(`"${memo.title}" 메모를 삭제할까요?`)) return;
        await api.remove(memo.id);
        load(q);
      }

      return (
        <div className="max-w-2xl mx-auto px-5 pb-16">
          <header className="text-center pt-12 pb-6">
            <h1 className="text-3xl font-bold">📝 메모장</h1>
            <p className="text-slate-400 mt-1">하버스쿨 AI 교육 · 4주차 · PostgreSQL DB 연동</p>
          </header>

          {error && (
            <div className="mb-4 bg-red-500/10 border border-red-500/40 text-red-300 rounded-xl px-4 py-3 text-sm">⚠️ {error}</div>
          )}

          {/* 작성 폼 */}
          <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-4 mb-5 space-y-2.5">
            <input type="text" value={title} maxLength={100}
              onChange={(e)=>setTitle(e.target.value)}
              onKeyDown={(e)=>{ if (e.key==="Enter" && !e.nativeEvent.isComposing) addMemo(); }}
              placeholder="제목"
              className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-sky-400" />
            <textarea value={content} rows={3}
              onChange={(e)=>setContent(e.target.value)}
              placeholder="내용 (선택)"
              className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-sky-400 resize-y" />
            <div className="flex justify-end">
              <button onClick={addMemo} disabled={!title.trim()}
                className="bg-sky-400 text-slate-900 font-bold px-6 py-2.5 rounded-xl hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed">저장</button>
            </div>
          </div>

          {/* 검색창 */}
          <div className="relative mb-4">
            <input type="text" value={q}
              onChange={(e)=>setQ(e.target.value)}
              placeholder="🔍 제목·내용 검색"
              className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 outline-none focus:border-sky-400" />
            {q && <button onClick={()=>setQ("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">✕</button>}
          </div>

          {/* 목록 */}
          {loading ? (
            <p className="text-slate-500 text-center py-10">불러오는 중…</p>
          ) : memos.length === 0 ? (
            <p className="text-slate-500 text-center py-10">
              {q ? `"${q}" 검색 결과가 없습니다.` : "아직 메모가 없습니다. 첫 메모를 작성해보세요!"}
            </p>
          ) : (
            <ul className="space-y-3">
              {memos.map(m => <MemoCard key={m.id} memo={m} onUpdate={updateMemo} onDelete={deleteMemo} />)}
            </ul>
          )}

          <p className="text-center mt-6 text-sm text-slate-500">전체 {memos.length}개 메모</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
